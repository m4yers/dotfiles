version: 1
input:
  type: object
  additionalProperties: false
  properties:
    intro: {type: string}
    instructions:
      type: object
      additionalProperties: false
      properties:
        ingestion: {type: string}
        inference: {type: string}
        presentation: {type: string}
      required: [ingestion, inference, presentation]
    result_header: {type: string}
    result_subsections:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          heading: {type: string}
          body: {type: string}
        required: [heading, body]
    scripts_ingestion: {$ref: '#/$defs/script_list'}
    scripts_inference: {$ref: '#/$defs/script_list'}
    scripts_presentation: {$ref: '#/$defs/script_list'}
    run_order_ingestion: {$ref: '#/$defs/str_list'}
    run_order_inference: {$ref: '#/$defs/str_list'}
    run_order_presentation: {$ref: '#/$defs/str_list'}
    vault_path: {type: string}
  required:
    - intro
    - instructions
    - result_header
    - result_subsections
    - scripts_ingestion
    - scripts_inference
    - scripts_presentation
    - run_order_ingestion
    - run_order_inference
    - run_order_presentation
    - vault_path
  $defs:
    script_list:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          name: {type: string}
          description: {type: string}
          source: {type: string}
          run_argv:
            type: array
            items: {type: string}
        required: [name, description, source, run_argv]
    str_list:
      type: array
      items: {type: string}
output:
  type: object
  additionalProperties: false
  properties:
    vault_path: {type: string}
    bytes_written: {type: integer}
  required: [vault_path, bytes_written]
