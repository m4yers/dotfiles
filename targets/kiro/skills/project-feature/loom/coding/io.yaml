version: 2
input:
  type: object
  additionalProperties: false
  properties:
    task:
      type: object
      additionalProperties: false
      properties:
        id: {type: string}
        title:
          type: string
          minLength: 1
        acceptance_criteria:
          type: array
          items: {type: string}
      required: [id, title, acceptance_criteria]
    cursor:
      type: integer
      description: 0-based position of this task in the pool.
    total:
      type: integer
      description: Total number of tasks in the pool.
    prior_diffs:
      type: [string, "null"]
      description: |
        Bounded summary of the diffs applied by earlier pool rounds
        (null on the first round). Read-only context: the workspace
        already contains those changes; build on top of them.
    build_system: {type: string}
    installed_skills:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          name: {type: string}
          path: {type: string}
          description: {type: string}
          scripts:
            type: array
            items: {type: string}
        required: [name, path, description, scripts]
    fallback_build_cmd: {type: string}
    fallback_test_cmd: {type: string}
    workspace_abs: {type: string}
    __loom: {}
    __task: {}
  required:
    - task
    - cursor
    - total
    - prior_diffs
    - build_system
    - installed_skills
    - fallback_build_cmd
    - fallback_test_cmd
    - workspace_abs
    - __loom
    - __task
output:
  type: object
  additionalProperties: false
  properties:
    applied:
      type: boolean
      description: |
        True iff the task's acceptance criteria were met and the
        changes verified (build/tests as instructed). False on any
        partial or failed round — the pool loop then retries or
        skips per its retry policy.
    error:
      type: string
      description: |
        Why applied is false (empty string when applied is true).
    diff:
      type: string
      description: |
        Unified diff of the changes applied by this round; empty
        string when nothing was changed.
    files_changed:
      type: array
      items: {type: string}
    notes:
      type: string
    cmds_used:
      type: array
      items: {type: string}
      description: Skill invocations or raw commands the agent actually ran.
  required: [applied, error, diff, files_changed, notes, cmds_used]
