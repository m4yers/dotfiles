# ============================================================
# SCALE VARIANT (S): project-feature is a PURE COMPOSER —
# three independent sibling skills wired through exact parameters:
#   overview (workspace intelligence) → design (research/design/
#   review) → engineering (tasks/implementation/code-review).
# The skills do not know each other; THIS graph is the only
# connection point. graph-s/m/l are three views of ONE composition
# — apply wiring changes to all three, then:
#   $LOOM validate <skill-root> --graph loom/graph-<x>.yaml
# ============================================================
tasks:
- id: overview
  kind: subgraph
  version: 1
  graph: ../../project-overview/loom/graph-s.yaml
- id: design
  kind: subgraph
  version: 1
  graph: ../../project-design/loom/graph-s.yaml
  depends_on_all: [overview]
  input:
    description: ${task:overview:description}
    workspace_abs: ${task:overview:workspace_abs}
    build_system: ${task:overview:build_system}
    build_installed_skills: ${task:overview:build_installed_skills}
    fallback_build_cmd: ${task:overview:fallback_build_cmd}
    fallback_test_cmd: ${task:overview:fallback_test_cmd}
    domains: ${task:overview:domains}
    summaries_store: ${task:overview:summaries_store}
    summaries_usage: ${task:overview:summaries_usage}
- id: engineering
  kind: subgraph
  version: 1
  graph: ../../project-engineering/loom/graph-s.yaml
  depends_on_all: [design]
  input:
    design: ${task:design:design}
    design_note: ${task:design:gate_note}
    workspace_abs: ${task:overview:workspace_abs}
    feature_slug: ${task:overview:feature_slug}
    build_system: ${task:overview:build_system}
    build_installed_skills: ${task:overview:build_installed_skills}
    test_system: ${task:overview:test_system}
    test_installed_skills: ${task:overview:test_installed_skills}
    fallback_build_cmd: ${task:overview:fallback_build_cmd}
    fallback_test_cmd: ${task:overview:fallback_test_cmd}
    reviewer_role_d1: ${task:overview:domains[0].reviewer_role}
    reviewer_role_d2: ${task:overview:domains[1].reviewer_role}
    reviewer_role_d3: ${task:overview:domains[2].reviewer_role}
    reviewer_role_d4: ${task:overview:domains[3].reviewer_role}
    reviewer_role_d5: ${task:overview:domains[4].reviewer_role}
    reviewer_role_d6: ${task:overview:domains[5].reviewer_role}
