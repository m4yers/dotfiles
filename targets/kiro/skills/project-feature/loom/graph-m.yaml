# ============================================================
# SCALE VARIANT (M): overview and design are SIBLING
# subgraph instances. design's entry takes EXACT parameters
# wired field-by-field from ${task:overview:*}; later
# stages read overview directly and the approved design via
# ${task:design:design} / decisions / gate_note.
# graph-s/m/l are three views of ONE pipeline over shared
# task folders — apply wiring changes to all three, then:
#   $LOOM validate <skill-root> --graph loom/graph-<x>.yaml
# ============================================================
tasks:
- id: overview
  kind: subgraph
  version: 1
  graph: ../../project-overview/loom/graph-m.yaml
- id: design
  kind: subgraph
  version: 1
  graph: ../../project-design/loom/graph-m.yaml
  depends_on_all:
  - overview
  input:
    description: ${task:overview:description}
    workspace_abs: ${task:overview:workspace_abs}
    build_system: ${task:overview:build_system}
    build_installed_skills: ${task:overview:build_installed_skills}
    fallback_build_cmd: ${task:overview:fallback_build_cmd}
    fallback_test_cmd: ${task:overview:fallback_test_cmd}
    domains: ${task:overview:domains}
    summaries_store: ${task:overview:summaries_store}
    summaries_usage: ${task:overview:summaries_usage}
- id: tasks-author
  kind: agent
  version: 5
  depends_on_all:
  - design
  - design
  input:
    design: ${task:design:design}
    human_note: ${task:design:gate_note}
    build_system: ${task:overview:build_system}
    installed_skills: ${task:overview:build_installed_skills}
    fallback_build_cmd: ${task:overview:fallback_build_cmd}
    fallback_test_cmd: ${task:overview:fallback_test_cmd}
    revise_reason: ${task:tasks-review-merge@prev:revise_reason}
- id: tasks-review-swe
  kind: agent
  version: 4
  ref: tasks-review
  depends_on_all:
  - tasks-author
  input:
    tasks: ${task:tasks-author:tasks}
    num_tasks: ${task:tasks-author:num_tasks}
    reviewer_role: You are a principal software engineer reviewing for correctness, maintainability, API
      design, error handling, and operational safety.
- id: tasks-review-d1
  kind: agent
  version: 4
  ref: tasks-review
  depends_on_all:
  - tasks-author
  input:
    tasks: ${task:tasks-author:tasks}
    num_tasks: ${task:tasks-author:num_tasks}
    reviewer_role: ${task:overview:domains[0].reviewer_role}
- id: tasks-review-d2
  kind: agent
  version: 4
  ref: tasks-review
  depends_on_all:
  - tasks-author
  input:
    tasks: ${task:tasks-author:tasks}
    num_tasks: ${task:tasks-author:num_tasks}
    reviewer_role: ${task:overview:domains[1].reviewer_role}
- id: tasks-review-d3
  kind: agent
  version: 4
  ref: tasks-review
  depends_on_all:
  - tasks-author
  input:
    tasks: ${task:tasks-author:tasks}
    num_tasks: ${task:tasks-author:num_tasks}
    reviewer_role: ${task:overview:domains[2].reviewer_role}
- id: tasks-review-d4
  kind: agent
  version: 4
  ref: tasks-review
  depends_on_all:
  - tasks-author
  input:
    tasks: ${task:tasks-author:tasks}
    num_tasks: ${task:tasks-author:num_tasks}
    reviewer_role: ${task:overview:domains[3].reviewer_role}
- id: tasks-review-merge
  kind: tool
  version: 5
  depends_on_all:
  - tasks-review-swe
  - tasks-author
  - tasks-review-d1
  - tasks-review-d2
  - tasks-review-d3
  - tasks-review-d4
  input:
    decision_swe: ${task:tasks-review-swe:decision}
    revise_reason_swe: ${task:tasks-review-swe:revise_reason}
    role_swe: You are a principal software engineer reviewing for correctness, maintainability, API design,
      error handling, and operational safety.
    decision_d1: ${task:tasks-review-d1:decision}
    revise_reason_d1: ${task:tasks-review-d1:revise_reason}
    role_d1: ${task:overview:domains[0].reviewer_role}
    num_tasks: ${task:tasks-author:num_tasks}
    decision_d2: ${task:tasks-review-d2:decision}
    revise_reason_d2: ${task:tasks-review-d2:revise_reason}
    role_d2: ${task:overview:domains[1].reviewer_role}
    decision_d3: ${task:tasks-review-d3:decision}
    revise_reason_d3: ${task:tasks-review-d3:revise_reason}
    role_d3: ${task:overview:domains[2].reviewer_role}
    decision_d4: ${task:tasks-review-d4:decision}
    revise_reason_d4: ${task:tasks-review-d4:revise_reason}
    role_d4: ${task:overview:domains[3].reviewer_role}
- id: workspace-guard
  kind: tool
  version: 1
  depends_on_all:
  - tasks-review-merge
  input:
    workspace_abs: ${task:overview:workspace_abs}
    feature_slug: ${task:overview:feature_slug}
- id: branch-gate
  kind: human
  version: 1
  depends_on_all:
  - workspace-guard
  input:
    dirty: ${task:workspace-guard:dirty}
    status_tail: ${task:workspace-guard:status_tail}
    current_branch: ${task:workspace-guard:current_branch}
    proposed_branch: ${task:workspace-guard:proposed_branch}
- id: branch-create
  kind: tool
  version: 1
  depends_on_all:
  - branch-gate
  input:
    decision: ${task:branch-gate:decision}
    workspace_abs: ${task:overview:workspace_abs}
    proposed_branch: ${task:workspace-guard:proposed_branch}
- id: pool-draw
  kind: tool
  version: 1
  depends_on_all:
  - branch-create
  input:
    tasks: ${task:tasks-author:tasks}
    prev: ${task:pool-advance@prev}
- id: impl-round
  kind: agent
  version: 2
  ref: coding
  depends_on_all:
  - pool-draw
  input:
    task: ${task:pool-draw:current_task}
    cursor: ${task:pool-draw:cursor}
    total: ${task:pool-draw:total}
    prior_diffs: ${task:pool-advance@prev:prior_diffs_summary}
    build_system: ${task:overview:build_system}
    installed_skills: ${task:overview:build_installed_skills}
    fallback_build_cmd: ${task:overview:fallback_build_cmd}
    fallback_test_cmd: ${task:overview:fallback_test_cmd}
    workspace_abs: ${task:overview:workspace_abs}
- id: pool-advance
  kind: tool
  version: 1
  depends_on_all:
  - impl-round
  input:
    cursor: ${task:pool-draw:cursor}
    total: ${task:pool-draw:total}
    current_task: ${task:pool-draw:current_task}
    applied: ${task:impl-round:applied}
    error: ${task:impl-round:error}
    diff: ${task:impl-round:diff}
    files_changed: ${task:impl-round:files_changed}
    notes: ${task:impl-round:notes}
    cmds_used: ${task:impl-round:cmds_used}
    prev: ${task:pool-advance@prev}
    retry_budget: '2'
    on_task_fail: skip
- id: verify-tests
  kind: tool
  version: 1
  depends_on_all:
  - pool-advance
  input:
    workspace_abs: ${task:overview:workspace_abs}
    build_system: ${task:overview:test_system}
    installed_skills: ${task:overview:test_installed_skills}
    fallback_test_cmd: ${task:overview:fallback_test_cmd}
- id: review-diffs-swe
  kind: agent
  version: 4
  ref: review-diffs
  depends_on_all:
  - verify-tests
  input:
    verify_test_cmd_used: ${task:verify-tests:test_cmd_used}
    verify_exit_code: ${task:verify-tests:exit_code}
    verify_passed: ${task:verify-tests:passed}
    verify_stdout_tail: ${task:verify-tests:stdout_tail}
    verify_stderr_tail: ${task:verify-tests:stderr_tail}
    build_system: ${task:overview:build_system}
    installed_skills: ${task:overview:build_installed_skills}
    reviewer_role: You are a principal software engineer reviewing for correctness, maintainability, API
      design, error handling, and operational safety.
    diff_bundle: ${task:pool-advance:diff_bundle}
    failed_task_ids: ${task:pool-advance:failed_task_ids}
    cmds_bundle: ${task:pool-advance:cmds_bundle}
- id: review-diffs-d1
  kind: agent
  version: 4
  ref: review-diffs
  depends_on_all:
  - verify-tests
  input:
    verify_test_cmd_used: ${task:verify-tests:test_cmd_used}
    verify_exit_code: ${task:verify-tests:exit_code}
    verify_passed: ${task:verify-tests:passed}
    verify_stdout_tail: ${task:verify-tests:stdout_tail}
    verify_stderr_tail: ${task:verify-tests:stderr_tail}
    build_system: ${task:overview:build_system}
    installed_skills: ${task:overview:build_installed_skills}
    reviewer_role: ${task:overview:domains[0].reviewer_role}
    diff_bundle: ${task:pool-advance:diff_bundle}
    failed_task_ids: ${task:pool-advance:failed_task_ids}
    cmds_bundle: ${task:pool-advance:cmds_bundle}
- id: review-diffs-d2
  kind: agent
  version: 4
  ref: review-diffs
  depends_on_all:
  - verify-tests
  input:
    verify_test_cmd_used: ${task:verify-tests:test_cmd_used}
    verify_exit_code: ${task:verify-tests:exit_code}
    verify_passed: ${task:verify-tests:passed}
    verify_stdout_tail: ${task:verify-tests:stdout_tail}
    verify_stderr_tail: ${task:verify-tests:stderr_tail}
    build_system: ${task:overview:build_system}
    installed_skills: ${task:overview:build_installed_skills}
    reviewer_role: ${task:overview:domains[1].reviewer_role}
    diff_bundle: ${task:pool-advance:diff_bundle}
    failed_task_ids: ${task:pool-advance:failed_task_ids}
    cmds_bundle: ${task:pool-advance:cmds_bundle}
- id: review-diffs-d3
  kind: agent
  version: 4
  ref: review-diffs
  depends_on_all:
  - verify-tests
  input:
    verify_test_cmd_used: ${task:verify-tests:test_cmd_used}
    verify_exit_code: ${task:verify-tests:exit_code}
    verify_passed: ${task:verify-tests:passed}
    verify_stdout_tail: ${task:verify-tests:stdout_tail}
    verify_stderr_tail: ${task:verify-tests:stderr_tail}
    build_system: ${task:overview:build_system}
    installed_skills: ${task:overview:build_installed_skills}
    reviewer_role: ${task:overview:domains[2].reviewer_role}
    diff_bundle: ${task:pool-advance:diff_bundle}
    failed_task_ids: ${task:pool-advance:failed_task_ids}
    cmds_bundle: ${task:pool-advance:cmds_bundle}
- id: review-diffs-d4
  kind: agent
  version: 4
  ref: review-diffs
  depends_on_all:
  - verify-tests
  input:
    verify_test_cmd_used: ${task:verify-tests:test_cmd_used}
    verify_exit_code: ${task:verify-tests:exit_code}
    verify_passed: ${task:verify-tests:passed}
    verify_stdout_tail: ${task:verify-tests:stdout_tail}
    verify_stderr_tail: ${task:verify-tests:stderr_tail}
    build_system: ${task:overview:build_system}
    installed_skills: ${task:overview:build_installed_skills}
    reviewer_role: ${task:overview:domains[3].reviewer_role}
    diff_bundle: ${task:pool-advance:diff_bundle}
    failed_task_ids: ${task:pool-advance:failed_task_ids}
    cmds_bundle: ${task:pool-advance:cmds_bundle}
- id: review-diffs-merge
  kind: tool
  version: 3
  depends_on_all:
  - review-diffs-swe
  - review-diffs-d1
  - review-diffs-d2
  - review-diffs-d3
  - review-diffs-d4
  input:
    verdict_swe: ${task:review-diffs-swe:verdict}
    findings_swe: ${task:review-diffs-swe:findings}
    summary_swe: ${task:review-diffs-swe:summary}
    role_swe: You are a principal software engineer reviewing for correctness, maintainability, API design,
      error handling, and operational safety.
    verdict_d1: ${task:review-diffs-d1:verdict}
    findings_d1: ${task:review-diffs-d1:findings}
    summary_d1: ${task:review-diffs-d1:summary}
    role_d1: ${task:overview:domains[0].reviewer_role}
    verdict_d2: ${task:review-diffs-d2:verdict}
    findings_d2: ${task:review-diffs-d2:findings}
    summary_d2: ${task:review-diffs-d2:summary}
    role_d2: ${task:overview:domains[1].reviewer_role}
    verdict_d3: ${task:review-diffs-d3:verdict}
    findings_d3: ${task:review-diffs-d3:findings}
    summary_d3: ${task:review-diffs-d3:summary}
    role_d3: ${task:overview:domains[2].reviewer_role}
    verdict_d4: ${task:review-diffs-d4:verdict}
    findings_d4: ${task:review-diffs-d4:findings}
    summary_d4: ${task:review-diffs-d4:summary}
    role_d4: ${task:overview:domains[3].reviewer_role}
- id: review-fix
  kind: agent
  version: 1
  depends_on_all:
  - review-diffs-merge
  input:
    findings: ${task:review-diffs-merge:findings}
    summary: ${task:review-diffs-merge:summary}
    workspace_abs: ${task:overview:workspace_abs}
    build_system: ${task:overview:build_system}
    installed_skills: ${task:overview:build_installed_skills}
    fallback_build_cmd: ${task:overview:fallback_build_cmd}
    fallback_test_cmd: ${task:overview:fallback_test_cmd}
    verify_test_cmd_used: ${task:verify-tests:test_cmd_used}
- id: final-gate
  kind: human
  version: 4
  depends_on_all:
  - review-fix
  input:
    verdict: ${task:review-diffs-merge:verdict}
    verify_stdout_tail: ${task:verify-tests:stdout_tail}
    verify_stderr_tail: ${task:verify-tests:stderr_tail}
    diff_bundle: ${task:pool-advance:diff_bundle}
    failed_task_ids: ${task:pool-advance:failed_task_ids}
    applied_count: ${task:pool-advance:applied_count}
latches:
- task: tasks-review-merge
  header: tasks-author
  fuel: 5
  while_: ${task:tasks-review-merge:decision} == 'revise'
- task: pool-advance
  header: pool-draw
  fuel: 200
  while_: ${task:pool-advance:remaining} > `0`
- task: review-fix
  header: verify-tests
  fuel: 5
  while_: ${task:review-fix:verdict} != 'approved'
