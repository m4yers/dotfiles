version: 1
input:
  type: object
  additionalProperties: false
  properties:
    dirty: {}
    status_tail: {type: string}
    current_branch: {type: string}
    proposed_branch: {type: string}
    __loom: {}
  required: [dirty, status_tail, current_branch, proposed_branch, __loom]
output:
  type: object
  additionalProperties: false
  properties:
    decision:
      type: string
      enum: [proceed, abort]
      description: |
        proceed: create the feature branch and continue to
        implementation. abort: stop the run (branch-create fails the
        graph, surfacing BLOCKED).
    note:
      type: string
      description: |
        What the user chose to do about a dirty tree (e.g. "stashed",
        "committed WIP", "carry dirty changes onto the branch").
        Empty string when the workspace was clean (auto-proceed).
  required: [decision, note]
