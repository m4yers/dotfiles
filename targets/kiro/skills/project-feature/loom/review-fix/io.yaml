version: 1
input:
  type: object
  additionalProperties: false
  properties:
    findings:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          file: {type: string}
          severity:
            type: string
            enum: [low, medium, high]
          message: {type: string}
        required: [file, severity, message]
    summary: {type: string}
    workspace_abs: {type: string}
    build_system: {type: string}
    installed_skills:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          name: {type: string}
          path: {type: string}
          description: {type: string}
          scripts:
            type: array
            items: {type: string}
        required: [name, path, description, scripts]
    fallback_build_cmd: {type: string}
    fallback_test_cmd: {type: string}
    verify_test_cmd_used: {type: string}
    __loom: {}
  required:
    - findings
    - summary
    - workspace_abs
    - build_system
    - installed_skills
    - fallback_build_cmd
    - fallback_test_cmd
    - verify_test_cmd_used
    - __loom
output:
  type: object
  additionalProperties: false
  properties:
    verdict:
      type: string
      enum: [approved, revise]
    patch:
      type: string
      description: Unified diff of the fix applied this round.
    iterations:
      type: integer
      description: Local iteration counter for this loop round.
  required: [verdict, patch, iterations]
