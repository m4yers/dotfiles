# ============================================================
# SCALE VARIANT (M): domains=4 research=3 impl=3 file-summary=4
# graph-s.yaml / graph-m.yaml / graph-l.yaml are three views of
# ONE pipeline over shared task folders. When you modify the
# wiring in THIS file, apply the same change to the other two
# variants, then validate all three:
#   $LOOM validate <skill-root> --graph loom/graph-<x>.yaml
# graph-m.yaml is the default the SKILL.md driver selects.
# ============================================================
tasks:
- id: ingest
  kind: tool
  version: 1
- id: code-inventory
  kind: tool
  version: 2
  depends_on_all:
  - ingest
  input:
    workspace_abs: ${task:ingest:workspace_abs}
    cache_dir: ${task:ingest:cache_dir}
    cache_mode: ${task:ingest:cache_mode}
- id: build-detect
  kind: tool
  version: 1
  depends_on_all:
  - ingest
  input:
    workspace_abs: ${task:ingest:workspace_abs}
    build_system_override: ${task:ingest:build_system_override}
    cache_dir: ${task:ingest:cache_dir}
    cache_mode: ${task:ingest:cache_mode}
- id: test-detect
  kind: tool
  version: 1
  depends_on_all:
  - build-detect
  input:
    workspace_abs: ${task:ingest:workspace_abs}
    build_system: ${task:build-detect:build_system}
    build_installed_skills: ${task:build-detect:installed_skills}
    test_system_override: ${task:ingest:test_system_override}
    cache_dir: ${task:ingest:cache_dir}
    cache_mode: ${task:ingest:cache_mode}
- id: dep-analysis
  kind: tool
  version: 1
  depends_on_all:
  - ingest
  input:
    workspace_abs: ${task:ingest:workspace_abs}
    cache_dir: ${task:ingest:cache_dir}
    cache_mode: ${task:ingest:cache_mode}
- id: symbol-index
  kind: tool
  version: 2
  depends_on_all:
  - ingest
  input:
    workspace_abs: ${task:ingest:workspace_abs}
    cache_dir: ${task:ingest:cache_dir}
- id: code-analysis-plan
  kind: tool
  version: 3
  depends_on_all:
  - code-inventory
  - symbol-index
  input:
    workspace_abs: ${task:ingest:workspace_abs}
    total_files: ${task:code-inventory:total_files}
    files: ${task:code-inventory:candidate_files}
    entrypoints: ${task:code-inventory:entrypoints}
    cache_dir: ${task:ingest:cache_dir}
    cache_mode: ${task:ingest:cache_mode}
    symbol_index_path: ${task:symbol-index:index_path}
    max_batches: '4'
- id: domain-detect
  kind: agent
  version: 3
  depends_on_all:
  - code-inventory
  - dep-analysis
  - symbol-index
  input:
    workspace_abs: ${task:ingest:workspace_abs}
    total_files: ${task:code-inventory:total_files}
    top_dirs: ${task:code-inventory:top_dirs}
    entrypoints: ${task:code-inventory:entrypoints}
    languages: ${task:code-inventory:languages}
    dependencies: ${task:dep-analysis:dependencies}
    unresolved_imports: ${task:dep-analysis:unresolved_imports}
    symbol_index_path: ${task:symbol-index:index_path}
    max_domains: '4'
- id: file-summary-b1
  kind: agent
  version: 1
  ref: file-summary
  depends_on_all:
  - code-analysis-plan
  input:
    workspace_abs: ${task:ingest:workspace_abs}
    files: ${task:code-analysis-plan:batches[0].files}
- id: file-summary-b2
  kind: agent
  version: 1
  ref: file-summary
  depends_on_all:
  - code-analysis-plan
  input:
    workspace_abs: ${task:ingest:workspace_abs}
    files: ${task:code-analysis-plan:batches[1].files}
- id: file-summary-b3
  kind: agent
  version: 1
  ref: file-summary
  depends_on_all:
  - code-analysis-plan
  input:
    workspace_abs: ${task:ingest:workspace_abs}
    files: ${task:code-analysis-plan:batches[2].files}
- id: file-summary-b4
  kind: agent
  version: 1
  ref: file-summary
  depends_on_all:
  - code-analysis-plan
  input:
    workspace_abs: ${task:ingest:workspace_abs}
    files: ${task:code-analysis-plan:batches[3].files}
- id: workspace-brief
  kind: tool
  version: 2
  depends_on_all:
  - code-inventory
  - dep-analysis
  - build-detect
  - test-detect
  - code-analysis-plan
  - file-summary-b1
  - file-summary-b2
  - file-summary-b3
  - file-summary-b4
  input:
    workspace_abs: ${task:ingest:workspace_abs}
    cache_dir: ${task:ingest:cache_dir}
    cache_mode: ${task:ingest:cache_mode}
    total_files: ${task:code-inventory:total_files}
    total_bytes: ${task:code-inventory:total_bytes}
    languages: ${task:code-inventory:languages}
    top_dirs: ${task:code-inventory:top_dirs}
    entrypoints: ${task:code-inventory:entrypoints}
    dependencies: ${task:dep-analysis:dependencies}
    unresolved_imports: ${task:dep-analysis:unresolved_imports}
    build_system: ${task:build-detect:build_system}
    build_provenance: ${task:build-detect:provenance}
    fallback_build_cmd: ${task:build-detect:fallback_build_cmd}
    test_system: ${task:test-detect:test_system}
    fallback_test_cmd: ${task:test-detect:fallback_test_cmd}
    summarize_mode: ${task:code-analysis-plan:summarize_mode}
    cached_summaries: ${task:code-analysis-plan:cached_summaries}
    summaries_b1: ${task:file-summary-b1:summaries}
    summaries_b2: ${task:file-summary-b2:summaries}
    summaries_b3: ${task:file-summary-b3:summaries}
    summaries_b4: ${task:file-summary-b4:summaries}
- id: research-plan
  kind: agent
  version: 4
  depends_on_all:
  - ingest
  - build-detect
  - test-detect
  - workspace-brief
  input:
    description: ${task:ingest:description}
    workspace_abs: ${task:ingest:workspace_abs}
    build_system: ${task:build-detect:build_system}
    installed_skills: ${task:build-detect:installed_skills}
    fallback_build_cmd: ${task:build-detect:fallback_build_cmd}
    fallback_test_cmd: ${task:test-detect:fallback_test_cmd}
    workspace_brief: ${task:workspace-brief:brief}
    max_questions: '3'
- id: research-q1
  kind: agent
  version: 1
  ref: research
  depends_on_all:
  - research-plan
  input:
    question: ${task:research-plan:questions[0].prompt}
- id: research-q2
  kind: agent
  version: 1
  ref: research
  depends_on_all:
  - research-plan
  input:
    question: ${task:research-plan:questions[1].prompt}
- id: research-q3
  kind: agent
  version: 1
  ref: research
  depends_on_all:
  - research-plan
  input:
    question: ${task:research-plan:questions[2].prompt}
- id: research-merge
  kind: agent
  version: 3
  depends_on_all:
  - research-q1
  - research-q2
  - research-q3
  input:
    q1_findings: ${task:research-q1:findings}
    q1_citations: ${task:research-q1:citations}
    q2_findings: ${task:research-q2:findings}
    q2_citations: ${task:research-q2:citations}
    q3_findings: ${task:research-q3:findings}
    q3_citations: ${task:research-q3:citations}
- id: design-author
  kind: agent
  version: 1
  depends_on_all:
  - research-merge
  - domain-detect
  - build-detect
  - test-detect
  input:
    report: ${task:research-merge:report}
    open_questions: ${task:research-merge:open_questions}
    build_system: ${task:build-detect:build_system}
    installed_skills: ${task:build-detect:installed_skills}
    fallback_build_cmd: ${task:build-detect:fallback_build_cmd}
    fallback_test_cmd: ${task:test-detect:fallback_test_cmd}
    revise_reason: ${task:design-review-merge@prev:revise_reason}
- id: design-review-swe
  kind: agent
  version: 2
  ref: design-review
  depends_on_all:
  - design-author
  input:
    design: ${task:design-author:design}
    decisions: ${task:design-author:decisions}
    open_risks: ${task:design-author:open_risks}
    reviewer_role: You are a principal software engineer reviewing for correctness, maintainability, API
      design, error handling, and operational safety.
- id: design-review-d1
  kind: agent
  version: 2
  ref: design-review
  depends_on_all:
  - design-author
  input:
    design: ${task:design-author:design}
    decisions: ${task:design-author:decisions}
    open_risks: ${task:design-author:open_risks}
    reviewer_role: ${task:domain-detect:domains[0].reviewer_role}
- id: design-review-d2
  kind: agent
  version: 2
  ref: design-review
  depends_on_all:
  - design-author
  input:
    design: ${task:design-author:design}
    decisions: ${task:design-author:decisions}
    open_risks: ${task:design-author:open_risks}
    reviewer_role: ${task:domain-detect:domains[1].reviewer_role}
- id: design-review-d3
  kind: agent
  version: 2
  ref: design-review
  depends_on_all:
  - design-author
  input:
    design: ${task:design-author:design}
    decisions: ${task:design-author:decisions}
    open_risks: ${task:design-author:open_risks}
    reviewer_role: ${task:domain-detect:domains[2].reviewer_role}
- id: design-review-d4
  kind: agent
  version: 2
  ref: design-review
  depends_on_all:
  - design-author
  input:
    design: ${task:design-author:design}
    decisions: ${task:design-author:decisions}
    open_risks: ${task:design-author:open_risks}
    reviewer_role: ${task:domain-detect:domains[3].reviewer_role}
- id: design-review-merge
  kind: tool
  version: 3
  depends_on_all:
  - design-review-swe
  - design-review-d1
  - design-review-d2
  - design-review-d3
  - design-review-d4
  input:
    decision_swe: ${task:design-review-swe:decision}
    revise_reason_swe: ${task:design-review-swe:revise_reason}
    role_swe: You are a principal software engineer reviewing for correctness, maintainability, API design,
      error handling, and operational safety.
    decision_d1: ${task:design-review-d1:decision}
    revise_reason_d1: ${task:design-review-d1:revise_reason}
    role_d1: ${task:domain-detect:domains[0].reviewer_role}
    decision_d2: ${task:design-review-d2:decision}
    revise_reason_d2: ${task:design-review-d2:revise_reason}
    role_d2: ${task:domain-detect:domains[1].reviewer_role}
    decision_d3: ${task:design-review-d3:decision}
    revise_reason_d3: ${task:design-review-d3:revise_reason}
    role_d3: ${task:domain-detect:domains[2].reviewer_role}
    decision_d4: ${task:design-review-d4:decision}
    revise_reason_d4: ${task:design-review-d4:revise_reason}
    role_d4: ${task:domain-detect:domains[3].reviewer_role}
- id: tasks-author
  kind: agent
  version: 3
  depends_on_all:
  - design-review-merge
  - domain-detect
  - build-detect
  - test-detect
  input:
    design: ${task:design-author:design}
    build_system: ${task:build-detect:build_system}
    installed_skills: ${task:build-detect:installed_skills}
    fallback_build_cmd: ${task:build-detect:fallback_build_cmd}
    fallback_test_cmd: ${task:test-detect:fallback_test_cmd}
    revise_reason: ${task:tasks-review-merge@prev:revise_reason}
    max_tasks: '3'
- id: tasks-review-swe
  kind: agent
  version: 3
  ref: tasks-review
  depends_on_all:
  - tasks-author
  input:
    tasks: ${task:tasks-author:tasks}
    num_tasks: ${task:tasks-author:num_tasks}
    reviewer_role: You are a principal software engineer reviewing for correctness, maintainability, API
      design, error handling, and operational safety.
- id: tasks-review-d1
  kind: agent
  version: 3
  ref: tasks-review
  depends_on_all:
  - tasks-author
  input:
    tasks: ${task:tasks-author:tasks}
    num_tasks: ${task:tasks-author:num_tasks}
    reviewer_role: ${task:domain-detect:domains[0].reviewer_role}
- id: tasks-review-d2
  kind: agent
  version: 3
  ref: tasks-review
  depends_on_all:
  - tasks-author
  input:
    tasks: ${task:tasks-author:tasks}
    num_tasks: ${task:tasks-author:num_tasks}
    reviewer_role: ${task:domain-detect:domains[1].reviewer_role}
- id: tasks-review-d3
  kind: agent
  version: 3
  ref: tasks-review
  depends_on_all:
  - tasks-author
  input:
    tasks: ${task:tasks-author:tasks}
    num_tasks: ${task:tasks-author:num_tasks}
    reviewer_role: ${task:domain-detect:domains[2].reviewer_role}
- id: tasks-review-d4
  kind: agent
  version: 3
  ref: tasks-review
  depends_on_all:
  - tasks-author
  input:
    tasks: ${task:tasks-author:tasks}
    num_tasks: ${task:tasks-author:num_tasks}
    reviewer_role: ${task:domain-detect:domains[3].reviewer_role}
- id: tasks-review-merge
  kind: tool
  version: 4
  depends_on_all:
  - tasks-review-swe
  - tasks-author
  - tasks-review-d1
  - tasks-review-d2
  - tasks-review-d3
  - tasks-review-d4
  input:
    decision_swe: ${task:tasks-review-swe:decision}
    revise_reason_swe: ${task:tasks-review-swe:revise_reason}
    role_swe: You are a principal software engineer reviewing for correctness, maintainability, API design,
      error handling, and operational safety.
    decision_d1: ${task:tasks-review-d1:decision}
    revise_reason_d1: ${task:tasks-review-d1:revise_reason}
    role_d1: ${task:domain-detect:domains[0].reviewer_role}
    num_tasks: ${task:tasks-author:num_tasks}
    decision_d2: ${task:tasks-review-d2:decision}
    revise_reason_d2: ${task:tasks-review-d2:revise_reason}
    role_d2: ${task:domain-detect:domains[1].reviewer_role}
    decision_d3: ${task:tasks-review-d3:decision}
    revise_reason_d3: ${task:tasks-review-d3:revise_reason}
    role_d3: ${task:domain-detect:domains[2].reviewer_role}
    decision_d4: ${task:tasks-review-d4:decision}
    revise_reason_d4: ${task:tasks-review-d4:revise_reason}
    role_d4: ${task:domain-detect:domains[3].reviewer_role}
- id: impl-t1
  kind: agent
  version: 1
  ref: coding
  depends_on_all:
  - tasks-review-merge
  input:
    task: ${task:tasks-author:tasks[0]}
    build_system: ${task:build-detect:build_system}
    installed_skills: ${task:build-detect:installed_skills}
    fallback_build_cmd: ${task:build-detect:fallback_build_cmd}
    fallback_test_cmd: ${task:test-detect:fallback_test_cmd}
    workspace_abs: ${task:ingest:workspace_abs}
- id: impl-t2
  kind: agent
  version: 1
  ref: coding
  depends_on_all:
  - tasks-review-merge
  input:
    task: ${task:tasks-author:tasks[1]}
    build_system: ${task:build-detect:build_system}
    installed_skills: ${task:build-detect:installed_skills}
    fallback_build_cmd: ${task:build-detect:fallback_build_cmd}
    fallback_test_cmd: ${task:test-detect:fallback_test_cmd}
    workspace_abs: ${task:ingest:workspace_abs}
- id: impl-t3
  kind: agent
  version: 1
  ref: coding
  depends_on_all:
  - tasks-review-merge
  input:
    task: ${task:tasks-author:tasks[2]}
    build_system: ${task:build-detect:build_system}
    installed_skills: ${task:build-detect:installed_skills}
    fallback_build_cmd: ${task:build-detect:fallback_build_cmd}
    fallback_test_cmd: ${task:test-detect:fallback_test_cmd}
    workspace_abs: ${task:ingest:workspace_abs}
- id: verify-tests
  kind: tool
  version: 1
  depends_on_all:
  - impl-t1
  - impl-t2
  - impl-t3
  input:
    workspace_abs: ${task:ingest:workspace_abs}
    build_system: ${task:test-detect:test_system}
    installed_skills: ${task:test-detect:installed_skills}
    fallback_test_cmd: ${task:test-detect:fallback_test_cmd}
- id: review-diffs-swe
  kind: agent
  version: 3
  ref: review-diffs
  depends_on_all:
  - verify-tests
  input:
    verify_test_cmd_used: ${task:verify-tests:test_cmd_used}
    verify_exit_code: ${task:verify-tests:exit_code}
    verify_passed: ${task:verify-tests:passed}
    verify_stdout_tail: ${task:verify-tests:stdout_tail}
    verify_stderr_tail: ${task:verify-tests:stderr_tail}
    build_system: ${task:build-detect:build_system}
    installed_skills: ${task:build-detect:installed_skills}
    reviewer_role: You are a principal software engineer reviewing for correctness, maintainability, API
      design, error handling, and operational safety.
    diff_t1: ${task:impl-t1:diff}
    cmds_used_t1: ${task:impl-t1:cmds_used}
    diff_t2: ${task:impl-t2:diff}
    cmds_used_t2: ${task:impl-t2:cmds_used}
    diff_t3: ${task:impl-t3:diff}
    cmds_used_t3: ${task:impl-t3:cmds_used}
- id: review-diffs-d1
  kind: agent
  version: 3
  ref: review-diffs
  depends_on_all:
  - verify-tests
  input:
    verify_test_cmd_used: ${task:verify-tests:test_cmd_used}
    verify_exit_code: ${task:verify-tests:exit_code}
    verify_passed: ${task:verify-tests:passed}
    verify_stdout_tail: ${task:verify-tests:stdout_tail}
    verify_stderr_tail: ${task:verify-tests:stderr_tail}
    build_system: ${task:build-detect:build_system}
    installed_skills: ${task:build-detect:installed_skills}
    reviewer_role: ${task:domain-detect:domains[0].reviewer_role}
    diff_t1: ${task:impl-t1:diff}
    cmds_used_t1: ${task:impl-t1:cmds_used}
    diff_t2: ${task:impl-t2:diff}
    cmds_used_t2: ${task:impl-t2:cmds_used}
    diff_t3: ${task:impl-t3:diff}
    cmds_used_t3: ${task:impl-t3:cmds_used}
- id: review-diffs-d2
  kind: agent
  version: 3
  ref: review-diffs
  depends_on_all:
  - verify-tests
  input:
    verify_test_cmd_used: ${task:verify-tests:test_cmd_used}
    verify_exit_code: ${task:verify-tests:exit_code}
    verify_passed: ${task:verify-tests:passed}
    verify_stdout_tail: ${task:verify-tests:stdout_tail}
    verify_stderr_tail: ${task:verify-tests:stderr_tail}
    build_system: ${task:build-detect:build_system}
    installed_skills: ${task:build-detect:installed_skills}
    reviewer_role: ${task:domain-detect:domains[1].reviewer_role}
    diff_t1: ${task:impl-t1:diff}
    cmds_used_t1: ${task:impl-t1:cmds_used}
    diff_t2: ${task:impl-t2:diff}
    cmds_used_t2: ${task:impl-t2:cmds_used}
    diff_t3: ${task:impl-t3:diff}
    cmds_used_t3: ${task:impl-t3:cmds_used}
- id: review-diffs-d3
  kind: agent
  version: 3
  ref: review-diffs
  depends_on_all:
  - verify-tests
  input:
    verify_test_cmd_used: ${task:verify-tests:test_cmd_used}
    verify_exit_code: ${task:verify-tests:exit_code}
    verify_passed: ${task:verify-tests:passed}
    verify_stdout_tail: ${task:verify-tests:stdout_tail}
    verify_stderr_tail: ${task:verify-tests:stderr_tail}
    build_system: ${task:build-detect:build_system}
    installed_skills: ${task:build-detect:installed_skills}
    reviewer_role: ${task:domain-detect:domains[2].reviewer_role}
    diff_t1: ${task:impl-t1:diff}
    cmds_used_t1: ${task:impl-t1:cmds_used}
    diff_t2: ${task:impl-t2:diff}
    cmds_used_t2: ${task:impl-t2:cmds_used}
    diff_t3: ${task:impl-t3:diff}
    cmds_used_t3: ${task:impl-t3:cmds_used}
- id: review-diffs-d4
  kind: agent
  version: 3
  ref: review-diffs
  depends_on_all:
  - verify-tests
  input:
    verify_test_cmd_used: ${task:verify-tests:test_cmd_used}
    verify_exit_code: ${task:verify-tests:exit_code}
    verify_passed: ${task:verify-tests:passed}
    verify_stdout_tail: ${task:verify-tests:stdout_tail}
    verify_stderr_tail: ${task:verify-tests:stderr_tail}
    build_system: ${task:build-detect:build_system}
    installed_skills: ${task:build-detect:installed_skills}
    reviewer_role: ${task:domain-detect:domains[3].reviewer_role}
    diff_t1: ${task:impl-t1:diff}
    cmds_used_t1: ${task:impl-t1:cmds_used}
    diff_t2: ${task:impl-t2:diff}
    cmds_used_t2: ${task:impl-t2:cmds_used}
    diff_t3: ${task:impl-t3:diff}
    cmds_used_t3: ${task:impl-t3:cmds_used}
- id: review-diffs-merge
  kind: tool
  version: 3
  depends_on_all:
  - review-diffs-swe
  - review-diffs-d1
  - review-diffs-d2
  - review-diffs-d3
  - review-diffs-d4
  input:
    verdict_swe: ${task:review-diffs-swe:verdict}
    findings_swe: ${task:review-diffs-swe:findings}
    summary_swe: ${task:review-diffs-swe:summary}
    role_swe: You are a principal software engineer reviewing for correctness, maintainability, API design,
      error handling, and operational safety.
    verdict_d1: ${task:review-diffs-d1:verdict}
    findings_d1: ${task:review-diffs-d1:findings}
    summary_d1: ${task:review-diffs-d1:summary}
    role_d1: ${task:domain-detect:domains[0].reviewer_role}
    verdict_d2: ${task:review-diffs-d2:verdict}
    findings_d2: ${task:review-diffs-d2:findings}
    summary_d2: ${task:review-diffs-d2:summary}
    role_d2: ${task:domain-detect:domains[1].reviewer_role}
    verdict_d3: ${task:review-diffs-d3:verdict}
    findings_d3: ${task:review-diffs-d3:findings}
    summary_d3: ${task:review-diffs-d3:summary}
    role_d3: ${task:domain-detect:domains[2].reviewer_role}
    verdict_d4: ${task:review-diffs-d4:verdict}
    findings_d4: ${task:review-diffs-d4:findings}
    summary_d4: ${task:review-diffs-d4:summary}
    role_d4: ${task:domain-detect:domains[3].reviewer_role}
- id: review-fix
  kind: agent
  version: 1
  depends_on_all:
  - review-diffs-merge
  input:
    findings: ${task:review-diffs-merge:findings}
    summary: ${task:review-diffs-merge:summary}
    workspace_abs: ${task:ingest:workspace_abs}
    build_system: ${task:build-detect:build_system}
    installed_skills: ${task:build-detect:installed_skills}
    fallback_build_cmd: ${task:build-detect:fallback_build_cmd}
    fallback_test_cmd: ${task:test-detect:fallback_test_cmd}
    verify_test_cmd_used: ${task:verify-tests:test_cmd_used}
- id: final-gate
  kind: human
  version: 3
  depends_on_all:
  - review-fix
  input:
    verdict: ${task:review-diffs-merge:verdict}
    verify_stdout_tail: ${task:verify-tests:stdout_tail}
    verify_stderr_tail: ${task:verify-tests:stderr_tail}
    diff_t1: ${task:impl-t1:diff}
    diff_t2: ${task:impl-t2:diff}
    diff_t3: ${task:impl-t3:diff}
latches:
- task: design-review-merge
  header: design-author
  fuel: 5
  while_: ${task:design-review-merge:decision} == 'revise'
- task: tasks-review-merge
  header: tasks-author
  fuel: 5
  while_: ${task:tasks-review-merge:decision} == 'revise'
- task: review-fix
  header: verify-tests
  fuel: 5
  while_: ${task:review-fix:verdict} != 'approved'
