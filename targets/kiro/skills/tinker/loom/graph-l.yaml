# ============================================================
# SCALE VARIANT (L): domains=6 research=5 impl=5 file-summary=6
# graph-s.yaml / graph-m.yaml / graph-l.yaml are three views of
# ONE pipeline over shared task folders. When you modify the
# wiring in THIS file, apply the same change to the other two
# variants, then validate all three:
#   $LOOM validate <skill-root> --graph loom/graph-<x>.yaml
# graph-m.yaml is the default the SKILL.md driver selects.
# ============================================================
tasks:
- id: ingest
  kind: tool
  version: 1
- id: code-inventory
  kind: tool
  version: 2
  depends_on_all:
  - ingest
  input:
    workspace_abs: ${task:ingest:workspace_abs}
    cache_dir: ${task:ingest:cache_dir}
    cache_mode: ${task:ingest:cache_mode}
- id: build-detect
  kind: tool
  version: 1
  depends_on_all:
  - ingest
  input:
    workspace_abs: ${task:ingest:workspace_abs}
    build_system_override: ${task:ingest:build_system_override}
    cache_dir: ${task:ingest:cache_dir}
    cache_mode: ${task:ingest:cache_mode}
- id: test-detect
  kind: tool
  version: 1
  depends_on_all:
  - build-detect
  input:
    workspace_abs: ${task:ingest:workspace_abs}
    build_system: ${task:build-detect:build_system}
    build_installed_skills: ${task:build-detect:installed_skills}
    test_system_override: ${task:ingest:test_system_override}
    cache_dir: ${task:ingest:cache_dir}
    cache_mode: ${task:ingest:cache_mode}
- id: dep-analysis
  kind: tool
  version: 1
  depends_on_all:
  - ingest
  input:
    workspace_abs: ${task:ingest:workspace_abs}
    cache_dir: ${task:ingest:cache_dir}
    cache_mode: ${task:ingest:cache_mode}
- id: symbol-index
  kind: tool
  version: 2
  depends_on_all:
  - ingest
  input:
    workspace_abs: ${task:ingest:workspace_abs}
    cache_dir: ${task:ingest:cache_dir}
- id: code-analysis-plan
  kind: tool
  version: 3
  depends_on_all:
  - code-inventory
  - symbol-index
  input:
    workspace_abs: ${task:ingest:workspace_abs}
    total_files: ${task:code-inventory:total_files}
    files: ${task:code-inventory:candidate_files}
    entrypoints: ${task:code-inventory:entrypoints}
    cache_dir: ${task:ingest:cache_dir}
    cache_mode: ${task:ingest:cache_mode}
    symbol_index_path: ${task:symbol-index:index_path}
    max_batches: '6'
- id: domain-detect
  kind: agent
  version: 3
  depends_on_all:
  - code-inventory
  - dep-analysis
  - symbol-index
  input:
    workspace_abs: ${task:ingest:workspace_abs}
    total_files: ${task:code-inventory:total_files}
    top_dirs: ${task:code-inventory:top_dirs}
    entrypoints: ${task:code-inventory:entrypoints}
    languages: ${task:code-inventory:languages}
    dependencies: ${task:dep-analysis:dependencies}
    unresolved_imports: ${task:dep-analysis:unresolved_imports}
    symbol_index_path: ${task:symbol-index:index_path}
    max_domains: '6'
- id: file-summary-b1
  kind: agent
  version: 1
  ref: file-summary
  depends_on_all:
  - code-analysis-plan
  input:
    workspace_abs: ${task:ingest:workspace_abs}
    files: ${task:code-analysis-plan:batches[0].files}
  when: length(${task:code-analysis-plan:batches[0].files}) > `0`
  skip_output:
    summaries: []
- id: file-summary-b2
  kind: agent
  version: 1
  ref: file-summary
  depends_on_all:
  - code-analysis-plan
  input:
    workspace_abs: ${task:ingest:workspace_abs}
    files: ${task:code-analysis-plan:batches[1].files}
  when: length(${task:code-analysis-plan:batches[1].files}) > `0`
  skip_output:
    summaries: []
- id: file-summary-b3
  kind: agent
  version: 1
  ref: file-summary
  depends_on_all:
  - code-analysis-plan
  input:
    workspace_abs: ${task:ingest:workspace_abs}
    files: ${task:code-analysis-plan:batches[2].files}
  when: length(${task:code-analysis-plan:batches[2].files}) > `0`
  skip_output:
    summaries: []
- id: file-summary-b4
  kind: agent
  version: 1
  ref: file-summary
  depends_on_all:
  - code-analysis-plan
  input:
    workspace_abs: ${task:ingest:workspace_abs}
    files: ${task:code-analysis-plan:batches[3].files}
  when: length(${task:code-analysis-plan:batches[3].files}) > `0`
  skip_output:
    summaries: []
- id: file-summary-b5
  kind: agent
  version: 1
  ref: file-summary
  depends_on_all:
  - code-analysis-plan
  input:
    workspace_abs: ${task:ingest:workspace_abs}
    files: ${task:code-analysis-plan:batches[4].files}
  when: length(${task:code-analysis-plan:batches[4].files}) > `0`
  skip_output:
    summaries: []
- id: file-summary-b6
  kind: agent
  version: 1
  ref: file-summary
  depends_on_all:
  - code-analysis-plan
  input:
    workspace_abs: ${task:ingest:workspace_abs}
    files: ${task:code-analysis-plan:batches[5].files}
  when: length(${task:code-analysis-plan:batches[5].files}) > `0`
  skip_output:
    summaries: []
- id: workspace-brief
  kind: tool
  version: 2
  depends_on_all:
  - code-inventory
  - dep-analysis
  - build-detect
  - test-detect
  - code-analysis-plan
  - file-summary-b1
  - file-summary-b2
  - file-summary-b3
  - file-summary-b4
  - file-summary-b5
  - file-summary-b6
  input:
    workspace_abs: ${task:ingest:workspace_abs}
    cache_dir: ${task:ingest:cache_dir}
    cache_mode: ${task:ingest:cache_mode}
    total_files: ${task:code-inventory:total_files}
    total_bytes: ${task:code-inventory:total_bytes}
    languages: ${task:code-inventory:languages}
    top_dirs: ${task:code-inventory:top_dirs}
    entrypoints: ${task:code-inventory:entrypoints}
    dependencies: ${task:dep-analysis:dependencies}
    unresolved_imports: ${task:dep-analysis:unresolved_imports}
    build_system: ${task:build-detect:build_system}
    build_provenance: ${task:build-detect:provenance}
    fallback_build_cmd: ${task:build-detect:fallback_build_cmd}
    test_system: ${task:test-detect:test_system}
    fallback_test_cmd: ${task:test-detect:fallback_test_cmd}
    summarize_mode: ${task:code-analysis-plan:summarize_mode}
    cached_summaries: ${task:code-analysis-plan:cached_summaries}
    summaries_b1: ${task:file-summary-b1:summaries}
    summaries_b2: ${task:file-summary-b2:summaries}
    summaries_b3: ${task:file-summary-b3:summaries}
    summaries_b4: ${task:file-summary-b4:summaries}
    summaries_b5: ${task:file-summary-b5:summaries}
    summaries_b6: ${task:file-summary-b6:summaries}
- id: research-plan
  kind: agent
  version: 4
  depends_on_all:
  - ingest
  - build-detect
  - test-detect
  - workspace-brief
  input:
    description: ${task:ingest:description}
    workspace_abs: ${task:ingest:workspace_abs}
    build_system: ${task:build-detect:build_system}
    installed_skills: ${task:build-detect:installed_skills}
    fallback_build_cmd: ${task:build-detect:fallback_build_cmd}
    fallback_test_cmd: ${task:test-detect:fallback_test_cmd}
    workspace_brief: ${task:workspace-brief:brief}
    max_questions: '5'
- id: research-q1
  kind: agent
  version: 1
  ref: research
  depends_on_all:
  - research-plan
  input:
    question: ${task:research-plan:questions[0].prompt}
  when: ${task:research-plan:questions[0].prompt} != ''
  skip_output:
    findings: ''
    citations: []
- id: research-q2
  kind: agent
  version: 1
  ref: research
  depends_on_all:
  - research-plan
  input:
    question: ${task:research-plan:questions[1].prompt}
  when: ${task:research-plan:questions[1].prompt} != ''
  skip_output:
    findings: ''
    citations: []
- id: research-q3
  kind: agent
  version: 1
  ref: research
  depends_on_all:
  - research-plan
  input:
    question: ${task:research-plan:questions[2].prompt}
  when: ${task:research-plan:questions[2].prompt} != ''
  skip_output:
    findings: ''
    citations: []
- id: research-q4
  kind: agent
  version: 1
  ref: research
  depends_on_all:
  - research-plan
  input:
    question: ${task:research-plan:questions[3].prompt}
  when: ${task:research-plan:questions[3].prompt} != ''
  skip_output:
    findings: ''
    citations: []
- id: research-q5
  kind: agent
  version: 1
  ref: research
  depends_on_all:
  - research-plan
  input:
    question: ${task:research-plan:questions[4].prompt}
  when: ${task:research-plan:questions[4].prompt} != ''
  skip_output:
    findings: ''
    citations: []
- id: research-merge
  kind: agent
  version: 3
  depends_on_all:
  - research-q1
  - research-q2
  - research-q3
  - research-q4
  - research-q5
  input:
    q1_findings: ${task:research-q1:findings}
    q1_citations: ${task:research-q1:citations}
    q2_findings: ${task:research-q2:findings}
    q2_citations: ${task:research-q2:citations}
    q3_findings: ${task:research-q3:findings}
    q3_citations: ${task:research-q3:citations}
    q4_findings: ${task:research-q4:findings}
    q4_citations: ${task:research-q4:citations}
    q5_findings: ${task:research-q5:findings}
    q5_citations: ${task:research-q5:citations}
- id: design-author
  kind: agent
  version: 1
  depends_on_all:
  - research-merge
  - domain-detect
  - build-detect
  - test-detect
  input:
    report: ${task:research-merge:report}
    open_questions: ${task:research-merge:open_questions}
    build_system: ${task:build-detect:build_system}
    installed_skills: ${task:build-detect:installed_skills}
    fallback_build_cmd: ${task:build-detect:fallback_build_cmd}
    fallback_test_cmd: ${task:test-detect:fallback_test_cmd}
    revise_reason: ${task:design-review-merge@prev:revise_reason}
- id: design-review-swe
  kind: agent
  version: 2
  ref: design-review
  depends_on_all:
  - design-author
  input:
    design: ${task:design-author:design}
    decisions: ${task:design-author:decisions}
    open_risks: ${task:design-author:open_risks}
    reviewer_role: You are a principal software engineer reviewing for correctness, maintainability, API
      design, error handling, and operational safety.
- id: design-review-d1
  kind: agent
  version: 2
  ref: design-review
  depends_on_all:
  - design-author
  input:
    design: ${task:design-author:design}
    decisions: ${task:design-author:decisions}
    open_risks: ${task:design-author:open_risks}
    reviewer_role: ${task:domain-detect:domains[0].reviewer_role}
- id: design-review-d2
  kind: agent
  version: 2
  ref: design-review
  depends_on_all:
  - design-author
  input:
    design: ${task:design-author:design}
    decisions: ${task:design-author:decisions}
    open_risks: ${task:design-author:open_risks}
    reviewer_role: ${task:domain-detect:domains[1].reviewer_role}
- id: design-review-d3
  kind: agent
  version: 2
  ref: design-review
  depends_on_all:
  - design-author
  input:
    design: ${task:design-author:design}
    decisions: ${task:design-author:decisions}
    open_risks: ${task:design-author:open_risks}
    reviewer_role: ${task:domain-detect:domains[2].reviewer_role}
- id: design-review-d4
  kind: agent
  version: 2
  ref: design-review
  depends_on_all:
  - design-author
  input:
    design: ${task:design-author:design}
    decisions: ${task:design-author:decisions}
    open_risks: ${task:design-author:open_risks}
    reviewer_role: ${task:domain-detect:domains[3].reviewer_role}
- id: design-review-d5
  kind: agent
  version: 2
  ref: design-review
  depends_on_all:
  - design-author
  input:
    design: ${task:design-author:design}
    decisions: ${task:design-author:decisions}
    open_risks: ${task:design-author:open_risks}
    reviewer_role: ${task:domain-detect:domains[4].reviewer_role}
- id: design-review-d6
  kind: agent
  version: 2
  ref: design-review
  depends_on_all:
  - design-author
  input:
    design: ${task:design-author:design}
    decisions: ${task:design-author:decisions}
    open_risks: ${task:design-author:open_risks}
    reviewer_role: ${task:domain-detect:domains[5].reviewer_role}
- id: citation-check
  kind: tool
  version: 1
  depends_on_all:
  - design-author
  input:
    design: ${task:design-author:design}
    workspace_abs: ${task:ingest:workspace_abs}
- id: design-review-merge
  kind: tool
  version: 4
  depends_on_all:
  - citation-check
  - design-review-swe
  - design-review-d1
  - design-review-d2
  - design-review-d3
  - design-review-d4
  - design-review-d5
  - design-review-d6
  input:
    citation_ok: ${task:citation-check:ok}
    citation_report: ${task:citation-check:report}
    decision_swe: ${task:design-review-swe:decision}
    revise_reason_swe: ${task:design-review-swe:revise_reason}
    role_swe: You are a principal software engineer reviewing for correctness, maintainability, API design,
      error handling, and operational safety.
    decision_d1: ${task:design-review-d1:decision}
    revise_reason_d1: ${task:design-review-d1:revise_reason}
    role_d1: ${task:domain-detect:domains[0].reviewer_role}
    decision_d2: ${task:design-review-d2:decision}
    revise_reason_d2: ${task:design-review-d2:revise_reason}
    role_d2: ${task:domain-detect:domains[1].reviewer_role}
    decision_d3: ${task:design-review-d3:decision}
    revise_reason_d3: ${task:design-review-d3:revise_reason}
    role_d3: ${task:domain-detect:domains[2].reviewer_role}
    decision_d4: ${task:design-review-d4:decision}
    revise_reason_d4: ${task:design-review-d4:revise_reason}
    role_d4: ${task:domain-detect:domains[3].reviewer_role}
    decision_d5: ${task:design-review-d5:decision}
    revise_reason_d5: ${task:design-review-d5:revise_reason}
    role_d5: ${task:domain-detect:domains[4].reviewer_role}
    decision_d6: ${task:design-review-d6:decision}
    revise_reason_d6: ${task:design-review-d6:revise_reason}
    role_d6: ${task:domain-detect:domains[5].reviewer_role}
- id: design-gate
  kind: human
  version: 1
  depends_on_all:
  - design-review-merge
  input:
    design: ${task:design-author:design}
    open_risks: ${task:design-author:open_risks}
    review_decision: ${task:design-review-merge:decision}
    revise_reason: ${task:design-review-merge:revise_reason}
- id: tasks-author
  kind: agent
  version: 5
  depends_on_all:
  - design-gate
  - domain-detect
  - build-detect
  - test-detect
  input:
    design: ${task:design-author:design}
    human_note: ${task:design-gate:note}
    build_system: ${task:build-detect:build_system}
    installed_skills: ${task:build-detect:installed_skills}
    fallback_build_cmd: ${task:build-detect:fallback_build_cmd}
    fallback_test_cmd: ${task:test-detect:fallback_test_cmd}
    revise_reason: ${task:tasks-review-merge@prev:revise_reason}
- id: tasks-review-swe
  kind: agent
  version: 4
  ref: tasks-review
  depends_on_all:
  - tasks-author
  input:
    tasks: ${task:tasks-author:tasks}
    num_tasks: ${task:tasks-author:num_tasks}
    reviewer_role: You are a principal software engineer reviewing for correctness, maintainability, API
      design, error handling, and operational safety.
- id: tasks-review-d1
  kind: agent
  version: 4
  ref: tasks-review
  depends_on_all:
  - tasks-author
  input:
    tasks: ${task:tasks-author:tasks}
    num_tasks: ${task:tasks-author:num_tasks}
    reviewer_role: ${task:domain-detect:domains[0].reviewer_role}
- id: tasks-review-d2
  kind: agent
  version: 4
  ref: tasks-review
  depends_on_all:
  - tasks-author
  input:
    tasks: ${task:tasks-author:tasks}
    num_tasks: ${task:tasks-author:num_tasks}
    reviewer_role: ${task:domain-detect:domains[1].reviewer_role}
- id: tasks-review-d3
  kind: agent
  version: 4
  ref: tasks-review
  depends_on_all:
  - tasks-author
  input:
    tasks: ${task:tasks-author:tasks}
    num_tasks: ${task:tasks-author:num_tasks}
    reviewer_role: ${task:domain-detect:domains[2].reviewer_role}
- id: tasks-review-d4
  kind: agent
  version: 4
  ref: tasks-review
  depends_on_all:
  - tasks-author
  input:
    tasks: ${task:tasks-author:tasks}
    num_tasks: ${task:tasks-author:num_tasks}
    reviewer_role: ${task:domain-detect:domains[3].reviewer_role}
- id: tasks-review-d5
  kind: agent
  version: 4
  ref: tasks-review
  depends_on_all:
  - tasks-author
  input:
    tasks: ${task:tasks-author:tasks}
    num_tasks: ${task:tasks-author:num_tasks}
    reviewer_role: ${task:domain-detect:domains[4].reviewer_role}
- id: tasks-review-d6
  kind: agent
  version: 4
  ref: tasks-review
  depends_on_all:
  - tasks-author
  input:
    tasks: ${task:tasks-author:tasks}
    num_tasks: ${task:tasks-author:num_tasks}
    reviewer_role: ${task:domain-detect:domains[5].reviewer_role}
- id: tasks-review-merge
  kind: tool
  version: 5
  depends_on_all:
  - tasks-review-swe
  - tasks-author
  - tasks-review-d1
  - tasks-review-d2
  - tasks-review-d3
  - tasks-review-d4
  - tasks-review-d5
  - tasks-review-d6
  input:
    decision_swe: ${task:tasks-review-swe:decision}
    revise_reason_swe: ${task:tasks-review-swe:revise_reason}
    role_swe: You are a principal software engineer reviewing for correctness, maintainability, API design,
      error handling, and operational safety.
    decision_d1: ${task:tasks-review-d1:decision}
    revise_reason_d1: ${task:tasks-review-d1:revise_reason}
    role_d1: ${task:domain-detect:domains[0].reviewer_role}
    num_tasks: ${task:tasks-author:num_tasks}
    decision_d2: ${task:tasks-review-d2:decision}
    revise_reason_d2: ${task:tasks-review-d2:revise_reason}
    role_d2: ${task:domain-detect:domains[1].reviewer_role}
    decision_d3: ${task:tasks-review-d3:decision}
    revise_reason_d3: ${task:tasks-review-d3:revise_reason}
    role_d3: ${task:domain-detect:domains[2].reviewer_role}
    decision_d4: ${task:tasks-review-d4:decision}
    revise_reason_d4: ${task:tasks-review-d4:revise_reason}
    role_d4: ${task:domain-detect:domains[3].reviewer_role}
    decision_d5: ${task:tasks-review-d5:decision}
    revise_reason_d5: ${task:tasks-review-d5:revise_reason}
    role_d5: ${task:domain-detect:domains[4].reviewer_role}
    decision_d6: ${task:tasks-review-d6:decision}
    revise_reason_d6: ${task:tasks-review-d6:revise_reason}
    role_d6: ${task:domain-detect:domains[5].reviewer_role}
- id: workspace-guard
  kind: tool
  version: 1
  depends_on_all:
  - tasks-review-merge
  input:
    workspace_abs: ${task:ingest:workspace_abs}
    feature_slug: ${task:ingest:feature_slug}
- id: branch-gate
  kind: human
  version: 1
  depends_on_all:
  - workspace-guard
  input:
    dirty: ${task:workspace-guard:dirty}
    status_tail: ${task:workspace-guard:status_tail}
    current_branch: ${task:workspace-guard:current_branch}
    proposed_branch: ${task:workspace-guard:proposed_branch}
- id: branch-create
  kind: tool
  version: 1
  depends_on_all:
  - branch-gate
  input:
    decision: ${task:branch-gate:decision}
    workspace_abs: ${task:ingest:workspace_abs}
    proposed_branch: ${task:workspace-guard:proposed_branch}
- id: pool-draw
  kind: tool
  version: 1
  depends_on_all:
  - branch-create
  input:
    tasks: ${task:tasks-author:tasks}
    prev: ${task:pool-advance@prev}
- id: impl-round
  kind: agent
  version: 2
  ref: coding
  depends_on_all:
  - pool-draw
  input:
    task: ${task:pool-draw:current_task}
    cursor: ${task:pool-draw:cursor}
    total: ${task:pool-draw:total}
    prior_diffs: ${task:pool-advance@prev:prior_diffs_summary}
    build_system: ${task:build-detect:build_system}
    installed_skills: ${task:build-detect:installed_skills}
    fallback_build_cmd: ${task:build-detect:fallback_build_cmd}
    fallback_test_cmd: ${task:test-detect:fallback_test_cmd}
    workspace_abs: ${task:ingest:workspace_abs}
- id: pool-advance
  kind: tool
  version: 1
  depends_on_all:
  - impl-round
  input:
    cursor: ${task:pool-draw:cursor}
    total: ${task:pool-draw:total}
    current_task: ${task:pool-draw:current_task}
    applied: ${task:impl-round:applied}
    error: ${task:impl-round:error}
    diff: ${task:impl-round:diff}
    files_changed: ${task:impl-round:files_changed}
    notes: ${task:impl-round:notes}
    cmds_used: ${task:impl-round:cmds_used}
    prev: ${task:pool-advance@prev}
    retry_budget: '2'
    on_task_fail: skip
- id: verify-tests
  kind: tool
  version: 1
  depends_on_all:
  - pool-advance
  input:
    workspace_abs: ${task:ingest:workspace_abs}
    build_system: ${task:test-detect:test_system}
    installed_skills: ${task:test-detect:installed_skills}
    fallback_test_cmd: ${task:test-detect:fallback_test_cmd}
- id: review-diffs-swe
  kind: agent
  version: 4
  ref: review-diffs
  depends_on_all:
  - verify-tests
  input:
    verify_test_cmd_used: ${task:verify-tests:test_cmd_used}
    verify_exit_code: ${task:verify-tests:exit_code}
    verify_passed: ${task:verify-tests:passed}
    verify_stdout_tail: ${task:verify-tests:stdout_tail}
    verify_stderr_tail: ${task:verify-tests:stderr_tail}
