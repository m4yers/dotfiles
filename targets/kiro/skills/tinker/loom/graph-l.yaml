    verdict_d4: ${task:review-diffs-d4:verdict}
    findings_d4: ${task:review-diffs-d4:findings}
    summary_d4: ${task:review-diffs-d4:summary}
    role_d4: ${task:overview:envelope.domains[3].reviewer_role}
    verdict_d5: ${task:review-diffs-d5:verdict}
    findings_d5: ${task:review-diffs-d5:findings}
    summary_d5: ${task:review-diffs-d5:summary}
    role_d5: ${task:overview:envelope.domains[4].reviewer_role}
    verdict_d6: ${task:review-diffs-d6:verdict}
    findings_d6: ${task:review-diffs-d6:findings}
    summary_d6: ${task:review-diffs-d6:summary}
    role_d6: ${task:overview:envelope.domains[5].reviewer_role}
- id: review-fix
  kind: agent
  version: 1
  depends_on_all:
  - review-diffs-merge
  input:
    findings: ${task:review-diffs-merge:findings}
    summary: ${task:review-diffs-merge:summary}
    workspace_abs: ${task:overview:envelope.workspace_abs}
    build_system: ${task:overview:envelope.build_system}
    installed_skills: ${task:overview:envelope.build_installed_skills}
    fallback_build_cmd: ${task:overview:envelope.fallback_build_cmd}
    fallback_test_cmd: ${task:overview:envelope.fallback_test_cmd}
    verify_test_cmd_used: ${task:verify-tests:test_cmd_used}
- id: final-gate
  kind: human
  version: 4
  depends_on_all:
  - review-fix
  input:
    verdict: ${task:review-diffs-merge:verdict}
    verify_stdout_tail: ${task:verify-tests:stdout_tail}
    verify_stderr_tail: ${task:verify-tests:stderr_tail}
    diff_bundle: ${task:pool-advance:diff_bundle}
    failed_task_ids: ${task:pool-advance:failed_task_ids}
    applied_count: ${task:pool-advance:applied_count}
latches:
- task: design-review-merge
  header: design-author
  fuel: 5
  while_: ${task:design-review-merge:decision} == 'revise'
- task: tasks-review-merge
  header: tasks-author
  fuel: 5
  while_: ${task:tasks-review-merge:decision} == 'revise'
- task: pool-advance
  header: pool-draw
  fuel: 200
  while_: ${task:pool-advance:remaining} > `0`
- task: review-fix
  header: verify-tests
  fuel: 5
  while_: ${task:review-fix:verdict} != 'approved'
