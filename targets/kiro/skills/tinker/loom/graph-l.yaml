- id: pool-draw
  kind: tool
  version: 1
  depends_on_all:
  - branch-create
  input:
    tasks: ${task:tasks-author:tasks}
    prev: ${task:pool-advance@prev}
- id: impl-round
  kind: agent
  version: 2
  ref: coding
  depends_on_all:
  - pool-draw
  input:
    task: ${task:pool-draw:current_task}
    cursor: ${task:pool-draw:cursor}
    total: ${task:pool-draw:total}
    prior_diffs: ${task:pool-advance@prev:prior_diffs_summary}
    build_system: ${task:overview:envelope.build_system}
    installed_skills: ${task:overview:envelope.build_installed_skills}
    fallback_build_cmd: ${task:overview:envelope.fallback_build_cmd}
    fallback_test_cmd: ${task:overview:envelope.fallback_test_cmd}
    workspace_abs: ${task:overview:envelope.workspace_abs}
- id: pool-advance
  kind: tool
  version: 1
  depends_on_all:
  - impl-round
  input:
    cursor: ${task:pool-draw:cursor}
    total: ${task:pool-draw:total}
    current_task: ${task:pool-draw:current_task}
    applied: ${task:impl-round:applied}
    error: ${task:impl-round:error}
    diff: ${task:impl-round:diff}
    files_changed: ${task:impl-round:files_changed}
    notes: ${task:impl-round:notes}
    cmds_used: ${task:impl-round:cmds_used}
    prev: ${task:pool-advance@prev}
    retry_budget: '2'
    on_task_fail: skip
- id: verify-tests
  kind: tool
  version: 1
  depends_on_all:
