version: 3
input:
  type: object
  additionalProperties: false
  properties:
    design: {type: string}
    build_system: {type: string}
    installed_skills:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          name: {type: string}
          path: {type: string}
          description: {type: string}
          scripts:
            type: array
            items: {type: string}
        required: [name, path, description, scripts]
    fallback_build_cmd: {type: string}
    fallback_test_cmd: {type: string}
    max_tasks:
      type: string
      description: |
        Tier capacity from the graph variant: fill at most this many
        real tasks (the array itself is always 5 entries).
    revise_reason:
      type: [string, "null"]
      description: |
        Null on iteration 0 (no previous review); populated by
        tasks-review-merge on revise.
    __loom: {}
  required:
    - design
    - build_system
    - installed_skills
    - fallback_build_cmd
    - fallback_test_cmd
    - max_tasks
    - revise_reason
    - __loom
output:
  type: object
  additionalProperties: false
  properties:
    tasks:
      type: array
      minItems: 5
      maxItems: 5
      items:
        type: object
        additionalProperties: false
        properties:
          id: {type: string}
          title:
            type: string
            description: |
              Task title; empty string on unused trailing slots (an
              empty title makes the slot a no-op).
          acceptance_criteria:
            type: array
            items: {type: string}
        required: [id, title, acceptance_criteria]
    num_tasks:
      type: integer
      minimum: 1
      maximum: 5
  required: [tasks, num_tasks]
