version: 5
input:
  type: object
  additionalProperties: false
  properties:
    design: {type: string}
    build_system: {type: string}
    installed_skills:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          name: {type: string}
          path: {type: string}
          description: {type: string}
          scripts:
            type: array
            items: {type: string}
        required: [name, path, description, scripts]
    fallback_build_cmd: {type: string}
    fallback_test_cmd: {type: string}
    human_note:
      type: string
      description: |
        Operator guidance captured at design-gate; empty when none.
    revise_reason:
      type: [string, "null"]
      description: |
        Null on iteration 0 (no previous review); populated by
        tasks-review-merge on revise.
    __loom: {}
  required:
    - design
    - build_system
    - installed_skills
    - fallback_build_cmd
    - fallback_test_cmd
    - human_note
    - revise_reason
    - __loom
output:
  type: object
  additionalProperties: false
  properties:
    tasks:
      type: array
      minItems: 1
      description: |
        Ordered implementation pool. Each entry MUST be sized to a
        single coding sub-agent session; the pool loop draws them
        one by one in order, so a task may assume every earlier
        task has already been applied to the workspace.
      items:
        type: object
        additionalProperties: false
        properties:
          id: {type: string}
          title:
            type: string
            minLength: 1
          acceptance_criteria:
            type: array
            minItems: 1
            items: {type: string}
        required: [id, title, acceptance_criteria]
    num_tasks:
      type: integer
      minimum: 1
      description: Must equal len(tasks).
  required: [tasks, num_tasks]
