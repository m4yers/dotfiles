version: 3
input:
  type: object
  additionalProperties: false
  properties:
    description: {type: string}
    workspace_abs: {type: string}
    build_system: {type: string}
    installed_skills:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          name: {type: string}
          path: {type: string}
          description: {type: string}
          scripts:
            type: array
            items: {type: string}
        required: [name, path, description, scripts]
    fallback_build_cmd: {type: string}
    fallback_test_cmd: {type: string}
    workspace_brief:
      type: string
      description: |
        Compact YAML brief from workspace-brief: inventory, file
        purposes, dependency map, build/test resolution.
    __loom: {}
  required:
    - description
    - workspace_abs
    - build_system
    - installed_skills
    - fallback_build_cmd
    - fallback_test_cmd
    - workspace_brief
    - __loom
output:
  type: object
  additionalProperties: false
  properties:
    questions:
      type: array
      minItems: 3
      maxItems: 3
      items:
        type: object
        additionalProperties: false
        properties:
          id: {type: string}
          prompt:
            type: string
            description: |
              Question text; empty string on unused trailing slots
              (an empty prompt makes the slot a no-op).
        required: [id, prompt]
    num_questions:
      type: integer
      minimum: 1
      maximum: 3
  required: [questions, num_questions]
