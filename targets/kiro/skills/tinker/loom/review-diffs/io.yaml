version: 4
input:
  type: object
  additionalProperties: false
  properties:
    diff_bundle:
      type: string
      description: |
        Accumulated per-round diff sections from the implementation
        pool loop (pool-advance output), in pool order. Each section
        is headed "## <task id>: <title> (applied|FAILED (skipped))".
    failed_task_ids:
      type: array
      items: {type: string}
      description: |
        Pool tasks skipped after exhausting their retry budget; a
        non-empty list means the aggregate change is incomplete.
    verify_test_cmd_used: {type: string}
    verify_exit_code: {type: integer}
    verify_passed: {type: boolean}
    verify_stdout_tail: {type: string}
    verify_stderr_tail: {type: string}
    build_system: {type: string}
    installed_skills:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          name: {type: string}
          path: {type: string}
          description: {type: string}
          scripts:
            type: array
            items: {type: string}
        required: [name, path, description, scripts]
    cmds_bundle:
      type: array
      items: {type: string}
      description: Accumulated cmds_used across all pool rounds.
    reviewer_role:
      type: string
      description: |
        Full role-priming sentence rendered verbatim at the top of
        the reviewer body. SWE literal for review-diffs-swe or a
        domain-detect-emitted sentence for review-diffs-d1/d2.
    __loom: {}
    __task: {}
  required:
    - diff_bundle
    - failed_task_ids
    - verify_test_cmd_used
    - verify_exit_code
    - verify_passed
    - verify_stdout_tail
    - verify_stderr_tail
    - build_system
    - installed_skills
    - cmds_bundle
    - reviewer_role
    - __loom
    - __task
output:
  type: object
  additionalProperties: false
  properties:
    verdict:
      type: string
      enum: [approved, revise]
    findings:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          file: {type: string}
          severity:
            type: string
            enum: [low, medium, high]
          message: {type: string}
        required: [file, severity, message]
    summary: {type: string}
  required: [verdict, findings, summary]
