version: 2
input:
  type: object
  additionalProperties: false
  properties:
    workspace_abs: {type: string}
    cache_dir:
      type: string
      description: |
        Scratch/transport location for the full index; empty means
        bypass (a per-run temp dir is used instead).
  required: [workspace_abs, cache_dir]
output:
  type: object
  additionalProperties: false
  properties:
    index_path:
      type: string
      description: |
        Absolute path to the full on-disk symbol index YAML
        (list of {path, symbols: [{name, kind}]}) covering every
        source file. Recomputed every run — ctags is fast enough
        that symbol data is never cached or trimmed. Only this
        path crosses the graph; consumers read the file directly.
    files_indexed: {type: integer}
    symbols_total: {type: integer}
    tags_tool:
      type: string
      description: |
        Which tier ran: ctags-json (universal-ctags), ctags-classic
        (exuberant), or regex.
  required: [index_path, files_indexed, symbols_total, tags_tool]
