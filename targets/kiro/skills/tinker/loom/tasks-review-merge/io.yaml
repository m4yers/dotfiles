version: 3
input:
  type: object
  additionalProperties: false
  properties:
    decision_swe:
      type: string
      enum: [accept, revise]
    revise_reason_swe:
      type: string
    role_swe:
      type: string
    decision_d1:
      type: string
      enum: [accept, revise]
    revise_reason_d1:
      type: string
    role_d1:
      type: string
    decision_d2:
      type: string
      enum: [accept, revise]
    revise_reason_d2:
      type: string
    role_d2:
      type: string
    decision_d3:
      type: string
      enum: [accept, revise]
    revise_reason_d3:
      type: string
    role_d3:
      type: string
    num_tasks:
      type: integer
      minimum: 1
      maximum: 5
      description: |
        Passthrough from tasks-author so the merged output echoes
        it downstream with one bare ref (impl fan-out predicates
        gate on this).
  required:
    - decision_swe
    - revise_reason_swe
    - role_swe
    - decision_d1
    - revise_reason_d1
    - role_d1
    - num_tasks
output:
  type: object
  additionalProperties: false
  properties:
    decision:
      type: string
      enum: [accept, revise]
      description: |
        `accept` iff all three reviewer decisions equal `accept`;
        `revise` otherwise.
    revise_reason:
      type: string
      description: |
        Empty on unanimous accept. On revise, the concatenated
        dissenter reasons under `[<reviewer_role>]` headers — one
        block per dissenter, in swe/d1/d2 order.
    num_tasks:
      type: integer
      minimum: 1
      maximum: 5
      description: Verbatim passthrough of the input num_tasks.
  required: [decision, revise_reason, num_tasks]
