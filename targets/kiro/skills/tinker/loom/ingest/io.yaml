version: 1
input:
  type: object
  additionalProperties: false
  properties:
    description:
      type: string
      minLength: 1
      description: |
        Free-text feature request supplied at ingest.
    workspace:
      type: string
      description: |
        Absolute path to the target repository/workspace the pipeline
        operates on. Canonicalised here.
    build_system_override:
      type: string
      description: |
        Optional user-supplied build-system family name (e.g. `brazil`,
        `uv`, `makefile`). Empty string when the user did not pass
        --build-system at ingest.
    test_system_override:
      type: string
      description: |
        Optional user-supplied test-system family name. Empty string
        when the user did not pass --test-system at ingest.
    cache_mode:
      type: string
      enum: [read-write, read-only, write-only, bypass]
      description: |
        Workspace-intelligence cache mode. read-write (default) reads
        and populates; read-only never populates; write-only recomputes
        and overwrites; bypass ignores the cache entirely.
  required:
    - description
    - workspace
    - build_system_override
    - test_system_override
    - cache_mode
output:
  type: object
  additionalProperties: false
  properties:
    feature_slug:
      type: string
      description: |
        Kebab-case slug derived from `description`; used to name
        downstream artefacts.
    workspace_abs:
      type: string
      description: |
        Canonicalised absolute workspace path (Path.resolve(strict=True)).
    description:
      type: string
      description: Echo of the ingest description.
    build_system_override:
      type: string
      description: Echo of the ingest override. Empty string when unset.
    test_system_override:
      type: string
      description: Echo of the ingest override. Empty string when unset.
    captured_at:
      type: string
      description: ISO-8601 UTC timestamp of the ingest.
    cache_dir:
      type: string
      description: |
        Absolute cache directory for this workspace+commit:
        /tmp/tinker-cache/<workspace-slug>/<cache-key>/ where
        <workspace-slug> is <basename>-<sha256(abs-path)[:8]>.
        Created (with a sibling files/ dir for per-file summary
        blobs) unless cache_mode is bypass, in which case it is
        the empty string.
    cache_key:
      type: string
      description: |
        git HEAD sha when the tree is clean; otherwise
        "<head>-dirty-<sha256(porcelain+NUL+diff)[:12]>". Non-git
        workspaces get "nogit-<stat-fingerprint[:12]>". Suffixed
        with "-s<schema-fingerprint[:8]>" so bumping any prelude
        io.yaml invalidates the cache automatically.
    git_head:
      type: string
      description: HEAD sha, or empty string for non-git workspaces.
    dirty:
      type: boolean
      description: True when the tree has uncommitted changes.
    cache_mode:
      type: string
      enum: [read-write, read-only, write-only, bypass]
      description: Echo for downstream tools.
  required:
    - feature_slug
    - workspace_abs
    - description
    - build_system_override
    - test_system_override
    - captured_at
    - cache_dir
    - cache_key
    - git_head
    - dirty
    - cache_mode
