version: 4
input:
  type: object
  additionalProperties: false
  properties:
    verdict:
      type: string
      description: |
        Merged review verdict from review-diffs-merge (unanimous
        `approved` across the three review-diffs reviewers, or
        `revise` when any reviewer dissented). Sourced from
        `${task:review-diffs-merge:verdict}` — review-fix's own
        verdict feeds the review-fix latch predicate and is
        intentionally not surfaced here.
    diff_bundle:
      type: string
      description: Accumulated pool-loop diff sections (pool-advance).
    failed_task_ids:
      type: array
      items: {type: string}
    applied_count: {type: integer}
    verify_stdout_tail: {type: string}
    verify_stderr_tail: {type: string}
    __loom: {}
  required: [verdict, diff_bundle, failed_task_ids, applied_count, verify_stdout_tail, verify_stderr_tail, __loom]
output:
  type: object
  additionalProperties: false
  properties:
    decision:
      type: string
      enum: [accept, abandon]
    note:
      type: string
      description: Optional free-text note; empty string when the user leaves it blank.
  required: [decision, note]
