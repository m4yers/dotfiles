version: 1
input:
  type: object
  additionalProperties: false
  properties:
    workspace_abs: {type: string}
    build_system_override:
      type: string
      description: Wins over manifest detection when non-empty.
    cache_dir: {type: string}
    cache_mode:
      type: string
      enum: [read-write, read-only, write-only, bypass]
  required: [workspace_abs, build_system_override, cache_dir, cache_mode]
output:
  type: object
  additionalProperties: false
  properties:
    build_system:
      type: string
      description: Resolved family name, or "unknown".
    provenance:
      type: string
      description: |
        "override:cli", the matched manifest marker (e.g.
        "pyproject.toml:[tool.uv]"), or "none".
    installed_skills:
      type: array
      description: |
        Installed skills named <build_system>-* under ~/.kiro/skills;
        downstream agents read these to learn build verbs.
      items:
        type: object
        additionalProperties: false
        properties:
          name: {type: string}
          path: {type: string}
          description: {type: string}
          scripts:
            type: array
            items: {type: string}
        required: [name, path, description, scripts]
    fallback_build_cmd:
      type: string
      description: Static-matrix build command; empty when unknown.
    cache_hit: {type: boolean}
  required:
    - build_system
    - provenance
    - installed_skills
    - fallback_build_cmd
    - cache_hit
