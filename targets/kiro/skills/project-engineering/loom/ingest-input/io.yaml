        2/4/6). Self-contained string; this skill does not know how it was derived.
    reviewer_role_d5:
      type: string
      description: Reviewer persona for domain slot 5 (scale variants use the first
        2/4/6). Self-contained string; this skill does not know how it was derived.
    reviewer_role_d6:
      type: string
      description: Reviewer persona for domain slot 6 (scale variants use the first
        2/4/6). Self-contained string; this skill does not know how it was derived.
