version: 1
input:
  type: object
  additionalProperties: false
  properties:
    summary: {type: string}
    # `__loom` is the reserved engine-provided input object; loom
    # substitutes its meta-schema — see references/io.md §5.
    __loom: {}
  required: [summary, __loom]
output:
  type: object
  additionalProperties: false
  properties:
    decision: {type: string, enum: [accept, revise]}
    reason: {type: string}
  required: [decision]
