version: 3
input:
  type: object
  additionalProperties: false
  required: &id001
  - description
  - workspace_abs
  - build_system
  - build_installed_skills
  - fallback_build_cmd
  - fallback_test_cmd
  - domains
  - summaries_store
  - summaries_usage
  properties: &id002
    description:
      type: string
      description: Free-text statement of the feature/problem to design.
    workspace_abs:
      type: string
      description: Absolute path of the workspace under design.
    build_system:
      type: string
      description: Detected or declared build-system family (e.g. make, brazil,
        uv).
    build_installed_skills:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          name:
            type: string
          path:
            type: string
          description:
            type: string
          scripts:
            type: array
            items:
              type: string
        required:
        - name
        - path
        - description
        - scripts
      description: Names of installed skills that teach building this workspace;
        take precedence over fallback_build_cmd.
    fallback_build_cmd:
      type: string
      description: Best-effort build command used when no build skill is installed.
    fallback_test_cmd:
      type: string
      description: Best-effort test command used when no test skill is installed.
    domains:
      type: array
      minItems: 6
      maxItems: 6
      items:
        type: object
        additionalProperties: false
        properties:
          slug:
            type: string
          name:
            type: string
          rationale:
            type: string
          reviewer_role:
            type: string
        required:
        - slug
        - name
        - rationale
        - reviewer_role
      description: Six problem domains detected in the workspace; reviewer_role
        phrases each as a design-review persona.
    summaries_store:
      type: string
      description: Absolute directory of per-file purpose summaries, one <file-sha256>.yaml
        per summarised file.
    summaries_usage:
      type: string
      description: How to look up a file's summary from summaries_store.
output:
  type: object
  additionalProperties: false
  required: *id001
  properties: *id002
