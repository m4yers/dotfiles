    shard: ${task:audit-shard-plan:shard_16}
    lint_findings: ${task:audit-autochecks:findings}
# Loop latch. prev_findings is this task's own previous wave (null on wave 1).
- id: audit-aggregate
  kind: tool
  version: 1
  depends_on_all: [audit-shard-01, audit-shard-02, audit-shard-03, audit-shard-04, audit-shard-05, audit-shard-06, audit-shard-07, audit-shard-08, audit-shard-09, audit-shard-10, audit-shard-11, audit-shard-12, audit-shard-13, audit-shard-14, audit-shard-15, audit-shard-16]
  input:
    prev_findings: ${task:audit-aggregate@prev:findings}
    shard_01_findings: ${task:audit-shard-01:findings}
    shard_02_findings: ${task:audit-shard-02:findings}
    shard_03_findings: ${task:audit-shard-03:findings}
    shard_04_findings: ${task:audit-shard-04:findings}
    shard_05_findings: ${task:audit-shard-05:findings}
    shard_06_findings: ${task:audit-shard-06:findings}
    shard_07_findings: ${task:audit-shard-07:findings}
    shard_08_findings: ${task:audit-shard-08:findings}
    shard_09_findings: ${task:audit-shard-09:findings}
    shard_10_findings: ${task:audit-shard-10:findings}
    shard_11_findings: ${task:audit-shard-11:findings}
    shard_12_findings: ${task:audit-shard-12:findings}
    shard_13_findings: ${task:audit-shard-13:findings}
    shard_14_findings: ${task:audit-shard-14:findings}
    shard_15_findings: ${task:audit-shard-15:findings}
    shard_16_findings: ${task:audit-shard-16:findings}
- id: audit-design
  kind: agent
  version: 1
  depends_on_all:
  - ingest-input
  - audit-autochecks
  input:
    skill_dir: ${task:ingest-input:skill_dir}
    design: ${task:ingest-input:design}
    lint_findings: ${task:audit-autochecks:findings}
  when: ${task:ingest-input:design_kind} == 'create'
  skip_output:
    findings: []
- id: audit-design-update
  kind: agent
  version: 1
  depends_on_all:
  - ingest-input
  - audit-autochecks
  input:
    skill_dir: ${task:ingest-input:skill_dir}
    plan: ${task:ingest-input:plan}
    lint_findings: ${task:audit-autochecks:findings}
  when: ${task:ingest-input:design_kind} == 'update'
  skip_output:
    findings: []
# Outside the loop: ${task:audit-aggregate:findings} is the final round.
- id: publish-output
  kind: tool
  version: 2
  depends_on_all:
  - ingest-input
  - audit-autochecks
  - audit-aggregate
  - audit-design
  - audit-design-update
  input:
    skill_dir: ${task:ingest-input:skill_dir}
    name: ${task:ingest-input:name}
    category: ${task:ingest-input:category}
    type: ${task:ingest-input:type}
    autochecks: ${task:audit-autochecks:findings}
    shards: ${task:audit-aggregate:findings}
    design: ${task:audit-design:findings}
    design_update: ${task:audit-design-update:findings}
latches:
# 8 waves x 48 checks = 384: a safety cap above the ~220 rules in
# references/. Normal exit is has_more going false.
- task: audit-aggregate
  header: audit-shard-plan
  fuel: 8
  while_: ${task:audit-shard-plan:has_more}
