# ============================================================
# AUDIT subgraph, embedded by loom/graph-{create,update,review}.yaml.
# Entry = ingest-input: locate shape + design_kind (+ design or plan).
# Exit = publish-output: assembled report.md path and counts.
# audit-topics -> audit-checks pick the rules (references/rule-codes.md);
# audit-shard-plan (loop header) fills 16 slots of <=3 checks per wave,
# audit-shard-01..16 (`ref: audit-shard`) judge one slot each, and
# audit-aggregate (latch) accumulates findings while has_more.
# audit-design / audit-design-update run alongside on create / update.
#   $LOOM validate <skill-root> --graph loom-audit/graph.yaml
# ============================================================
tasks:
- id: ingest-input
  kind: tool
  version: 1
- id: audit-autochecks
  kind: tool
  version: 1
  depends_on_all: [ingest-input]
  input:
    skill_dir: ${task:ingest-input:skill_dir}
- id: audit-topics
  kind: tool
  version: 1
  depends_on_all: [ingest-input]
  input:
    skill_dir: ${task:ingest-input:skill_dir}
    type: ${task:ingest-input:type}
- id: audit-checks
  kind: tool
  version: 1
  depends_on_all: [audit-topics]
  input:
    topics: ${task:audit-topics:topics}
# Loop header. `prev` is this task's own previous wave (null on wave 1).
- id: audit-shard-plan
  kind: tool
  version: 1
  depends_on_all: [audit-checks, audit-autochecks]
  input:
    checks: ${task:audit-checks:checks}
    prev: ${task:audit-shard-plan@prev}
- id: audit-shard-01
  kind: agent
  version: 1
  ref: audit-shard
  depends_on_all: [audit-shard-plan]
  when: ${task:audit-shard-plan:shard_01.populated}
  skip_output:
    findings: []
  input:
    skill_dir: ${task:ingest-input:skill_dir}
    name: ${task:ingest-input:name}
    type: ${task:ingest-input:type}
    shard: ${task:audit-shard-plan:shard_01}
    lint_findings: ${task:audit-autochecks:findings}
- id: audit-shard-02
  kind: agent
  version: 1
  ref: audit-shard
  depends_on_all: [audit-shard-plan]
  when: ${task:audit-shard-plan:shard_02.populated}
  skip_output:
    findings: []
  input:
    skill_dir: ${task:ingest-input:skill_dir}
    name: ${task:ingest-input:name}
    type: ${task:ingest-input:type}
    shard: ${task:audit-shard-plan:shard_02}
    lint_findings: ${task:audit-autochecks:findings}
- id: audit-shard-03
  kind: agent
  version: 1
