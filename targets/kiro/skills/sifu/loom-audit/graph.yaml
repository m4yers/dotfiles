    type: ${task:ingest-input:type}
    shard: ${task:audit-shard-plan:shard_05}
    lint_findings: ${task:audit-autochecks:findings}
- id: audit-shard-06
  kind: agent
  version: 1
  ref: audit-shard
  depends_on_all: [audit-shard-plan]
  when: ${task:audit-shard-plan:shard_06.populated}
