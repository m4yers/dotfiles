version: 1
input:
  type: object
  additionalProperties: false
  properties:
    skill_dir:
      type: string
    design:
      type:
      - object
      - 'null'
      description: Validated upstream (schemas/design.yaml or schemas/change-plan.yaml);
        absent when not auditing a design.
    lint_findings: &id001
      type: array
      items:
        $ref: ../../schemas/finding.yaml
    __loom: {}
    __task: {}
  required:
  - skill_dir
  - lint_findings
  - __loom
  - __task
output:
  type: object
  additionalProperties: false
  properties:
    findings: *id001
  required:
  - findings
