# audit-shard — judges up to 3 checks against the skill; instanced as
# audit-shard-01..16 by graph.yaml.
version: 1
input:
  type: object
  additionalProperties: false
  properties:
    skill_dir:
      type: string
      description: Absolute skill directory.
    name:
      type: string
    type:
      type: string
      description: Skill type from SKILL.md frontmatter.
    shard:
      $ref: ../../schemas/shard.yaml
    lint_findings: &id001
      type: array
      items:
        $ref: ../../schemas/finding.yaml
    __loom: {}
    __task: {}
  required:
  - skill_dir
  - name
  - type
  - shard
  - lint_findings
  - __loom
  - __task
output:
  type: object
  additionalProperties: false
  properties:
    findings: *id001
  required:
  - findings
