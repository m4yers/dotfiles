version: 1
input:
  type: object
  additionalProperties: false
  properties:
    skill_dir:
      type: string
    report_path:
      type: string
    errors: &id001
      type: integer
      minimum: 0
    warnings: *id001
    __loom: {}
    __task: {}
  required:
  - skill_dir
  - report_path
  - errors
  - warnings
  - __loom
  - __task
output:
  type: object
  additionalProperties: false
  properties:
    files:
      type: array
      items:
        $ref: ../../schemas/file-change.yaml
  required:
  - files
