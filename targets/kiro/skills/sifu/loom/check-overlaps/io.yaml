version: 1
input:
  type: object
  additionalProperties: false
  properties:
    name:
      type: string
    description:
      type: string
  required:
  - name
  - description
output:
  type: object
  additionalProperties: false
  properties:
    has_overlaps:
      type: boolean
    overlaps:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          skill:
            type: string
          reason:
            type: string
        required:
        - skill
        - reason
  required:
  - has_overlaps
  - overlaps
