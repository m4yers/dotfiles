version: 2
input:
  type: object
  additionalProperties: false
  properties:
    workspace_abs: {type: string}
    build_system:
      type: string
      description: Resolved family from detect-build.
    build_installed_skills:
      type: array
      description: detect-build's skill scan, reused when no override.
      items:
        type: object
        additionalProperties: false
        properties:
          name: {type: string}
          path: {type: string}
          description: {type: string}
          scripts:
            type: array
            items: {type: string}
        required: [name, path, description, scripts]
    test_system_override:
      type: string
      description: Wins over the build-system family when non-empty.
    cache_prefix:
      type: string
      description: |
        Composed cache prefix from ingest-input (empty when
        cache_mode is bypass). Cached doc lives at
        `<cache_prefix>/detect-tests`.
    cache_mode:
      type: string
      enum: [read-write, read-only, write-only, bypass]
  required:
    - workspace_abs
    - build_system
    - build_installed_skills
    - test_system_override
    - cache_prefix
    - cache_mode
output:
  type: object
  additionalProperties: false
  properties:
    test_system:
      type: string
      description: |
        Resolved test family: the override when given, otherwise the
        build-system family, or "unknown".
    provenance:
      type: string
      description: '"override:cli", "build-system", or "none".'
    installed_skills:
      type: array
      description: |
        Installed skills named <test_system>-*; verify-tests resolves
        its test shim from these.
      items:
        type: object
        additionalProperties: false
        properties:
          name: {type: string}
          path: {type: string}
          description: {type: string}
          scripts:
            type: array
            items: {type: string}
        required: [name, path, description, scripts]
    fallback_test_cmd:
      type: string
      description: Static-matrix test command; empty when unknown.
    cache_hit: {type: boolean}
  required:
    - test_system
    - provenance
    - installed_skills
    - fallback_test_cmd
    - cache_hit
