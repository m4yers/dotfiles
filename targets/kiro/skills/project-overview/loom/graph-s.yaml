tasks:
- id: ingest-input
  kind: tool
  version: 2
- id: inventory-code
  kind: tool
  version: 5
  depends_on_all:
  - ingest-input
  input:
    workspace_abs: ${task:ingest-input:workspace_abs}
    cache_prefix: ${task:ingest-input:cache_prefix}
    cache_mode: ${task:ingest-input:cache_mode}
- id: detect-build
  kind: tool
  version: 2
  depends_on_all:
  - ingest-input
  input:
    workspace_abs: ${task:ingest-input:workspace_abs}
    build_system_override: ${task:ingest-input:build_system_override}
    cache_prefix: ${task:ingest-input:cache_prefix}
    cache_mode: ${task:ingest-input:cache_mode}
- id: detect-tests
  kind: tool
  version: 2
  depends_on_all:
  - detect-build
  input:
    workspace_abs: ${task:ingest-input:workspace_abs}
    build_system: ${task:detect-build:build_system}
    build_installed_skills: ${task:detect-build:installed_skills}
    test_system_override: ${task:ingest-input:test_system_override}
    cache_prefix: ${task:ingest-input:cache_prefix}
    cache_mode: ${task:ingest-input:cache_mode}
- id: detect-deps
  kind: tool
  version: 2
  depends_on_all:
  - ingest-input
  input:
    workspace_abs: ${task:ingest-input:workspace_abs}
    cache_prefix: ${task:ingest-input:cache_prefix}
    cache_mode: ${task:ingest-input:cache_mode}
- id: index-symbols
  kind: tool
  version: 4
  depends_on_all:
  - ingest-input
  input:
    workspace_abs: ${task:ingest-input:workspace_abs}
    cache_prefix: ${task:ingest-input:cache_prefix}
    cache_mode: ${task:ingest-input:cache_mode}
- id: plan-code-analysis
  kind: tool
  version: 7
  depends_on_all:
  - inventory-code
  - index-symbols
  input:
    workspace_abs: ${task:ingest-input:workspace_abs}
    entrypoints: ${task:inventory-code:entrypoints}
    cache_prefix: ${task:ingest-input:cache_prefix}
    blob_prefix: ${task:ingest-input:blob_prefix}
    cache_mode: ${task:ingest-input:cache_mode}
    index_symbols_path: ${task:index-symbols:index_path}
    max_batches: '10'
    candidates_path: ${task:inventory-code:candidates_path}
    summary_budget: '750'
- id: detect-domains
  kind: agent
  version: 3
  depends_on_all:
  - inventory-code
  - detect-deps
  - index-symbols
  input:
    workspace_abs: ${task:ingest-input:workspace_abs}
    total_files: ${task:inventory-code:total_files}
    top_dirs: ${task:inventory-code:top_dirs}
    entrypoints: ${task:inventory-code:entrypoints}
    languages: ${task:inventory-code:languages}
    dependencies: ${task:detect-deps:dependencies}
    unresolved_imports: ${task:detect-deps:unresolved_imports}
    index_symbols_path: ${task:index-symbols:index_path}
    max_domains: '2'
- id: summarise-files-b1
  kind: agent
  version: 3
  ref: summarise-files
  model: claude-haiku-4.5
  depends_on_all:
  - plan-code-analysis
  input:
    workspace_abs: ${task:ingest-input:workspace_abs}
    files: ${task:plan-code-analysis:batches[0].files}
    blob_prefix: ${task:ingest-input:blob_prefix}
    cache_mode: ${task:ingest-input:cache_mode}
  when: length(${task:plan-code-analysis:batches[0].files}) > `0`
  skip_output:
    summaries: []
- id: summarise-files-b2
  kind: agent
  version: 3
