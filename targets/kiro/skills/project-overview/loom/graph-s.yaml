- id: publish-output
  kind: tool
  version: 9
  depends_on_all:
  - summarise-files-b1
  - summarise-files-b2
  - summarise-files-b3
  - summarise-files-b4
  - summarise-files-b5
  - summarise-files-b6
  - summarise-files-b7
  - summarise-files-b8
  - summarise-files-b9
  - summarise-files-b10
  - plan-code-analysis
  - detect-deps
  - inventory-code
  - ingest-input
  - detect-build
  - detect-tests
  - detect-domains
  input:
    workspace_abs: ${task:ingest-input:workspace_abs}
    feature_slug: ${task:ingest-input:feature_slug}
    description: ${task:ingest-input:description}
    build_system: ${task:detect-build:build_system}
    build_installed_skills: ${task:detect-build:installed_skills}
    fallback_build_cmd: ${task:detect-build:fallback_build_cmd}
    test_system: ${task:detect-tests:test_system}
    test_installed_skills: ${task:detect-tests:installed_skills}
    fallback_test_cmd: ${task:detect-tests:fallback_test_cmd}
    domains: ${task:detect-domains:domains}
    cache_prefix: ${task:ingest-input:cache_prefix}
    blob_prefix: ${task:ingest-input:blob_prefix}
    cache_key: ${task:ingest-input:cache_key}
    git_head: ${task:ingest-input:git_head}
    dirty: ${task:ingest-input:dirty}
    cache_mode: ${task:ingest-input:cache_mode}
    total_files: ${task:inventory-code:total_files}
    total_bytes: ${task:inventory-code:total_bytes}
    languages: ${task:inventory-code:languages}
    top_dirs: ${task:inventory-code:top_dirs}
    entrypoints: ${task:inventory-code:entrypoints}
    dependencies: ${task:detect-deps:dependencies}
    unresolved_imports: ${task:detect-deps:unresolved_imports}
    build_provenance: ${task:detect-build:provenance}
    summarize_mode: ${task:plan-code-analysis:summarize_mode}
