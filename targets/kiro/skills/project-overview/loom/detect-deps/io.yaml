version: 2
input:
  type: object
  additionalProperties: false
  properties:
    workspace_abs: {type: string}
    cache_prefix:
      type: string
      description: |
        Composed cache prefix from ingest-input (empty when
        cache_mode is bypass). Cached doc lives at
        `<cache_prefix>/detect-deps`.
    cache_mode:
      type: string
      enum: [read-write, read-only, write-only, bypass]
  required: [workspace_abs, cache_prefix, cache_mode]
output:
  type: object
  additionalProperties: false
  properties:
    dependencies:
      type: array
      description: |
        Declared dependencies from manifests, with usage sites from a
        batched grep (top 10 files per dep). Capped at 200 entries.
      items:
        type: object
        additionalProperties: false
        properties:
          name: {type: string}
          spec:
            type: string
            description: Version spec/constraint; empty when none.
          scope:
            type: string
            enum: [runtime, dev, unknown]
          origin:
            type: string
            description: Manifest file (and section) that declared it.
          used_in:
            type: array
            items: {type: string}
            description: Up to 10 files importing/including this dep.
        required: [name, spec, scope, origin, used_in]
    unresolved_imports:
      type: array
      description: |
        Top-level imports/includes seen in code with no matching
        manifest entry (capped at 40).
      items:
        type: object
        additionalProperties: false
        properties:
          name: {type: string}
          files:
            type: array
            items: {type: string}
        required: [name, files]
    grep_tool:
      type: string
      description: Which search tier ran (rg, git-grep, python-re).
    cache_hit: {type: boolean}
  required: [dependencies, unresolved_imports, grep_tool, cache_hit]
