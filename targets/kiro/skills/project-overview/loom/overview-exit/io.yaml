version: 3
input:
  type: object
  additionalProperties: false
  properties:
    workspace_abs:
      type: string
      description: |
        Canonicalised absolute workspace path (from
        overview-ingest.workspace_abs).
    feature_slug:
      type: string
      description: |
        Kebab-case slug derived from the description (from
        overview-ingest.feature_slug).
    description:
      type: string
      description: |
        Echo of the ingest description (from
        overview-ingest.description).
    build_system:
      type: string
      description: |
        Resolved build-system family (from build-detect.build_system).
    build_installed_skills:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          name: {type: string}
          path: {type: string}
          description: {type: string}
          scripts:
            type: array
            items: {type: string}
        required: [name, path, description, scripts]
      description: |
        Installed build-* skills that teach concrete verbs (from
        build-detect.installed_skills).
    fallback_build_cmd:
      type: string
      description: |
        Static per-family default build command (from
        build-detect.fallback_build_cmd).
    test_system:
      type: string
      description: |
        Resolved test-system family (from test-detect.test_system).
    test_installed_skills:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          name: {type: string}
          path: {type: string}
          description: {type: string}
          scripts:
            type: array
            items: {type: string}
        required: [name, path, description, scripts]
      description: |
        Installed test-* skills (from test-detect.installed_skills
        when the test-detect task surfaces them; otherwise empty).
    fallback_test_cmd:
      type: string
      description: |
        Static per-family default test command (from
        test-detect.fallback_test_cmd).
    workspace_brief:
      type: string
      description: |
        Compact YAML brief (from workspace-brief.brief) — injected
        verbatim into downstream prompts by consumers.
    domains:
      type: array
      description: |
        Exactly 6 fixed slots (from domain-detect.domains); trailing
        unused slots carry empty strings.
      minItems: 6
      maxItems: 6
      items:
        type: object
        additionalProperties: false
        properties:
          slug: {type: string}
          name: {type: string}
          rationale: {type: string}
          reviewer_role: {type: string}
        required: [slug, name, rationale, reviewer_role]
    cache_prefix:
      type: string
      description: |
        Composed cache prefix from overview-ingest.cache_prefix
        (empty when cache_mode is bypass).
    blob_prefix:
      type: string
      description: |
        Content-addressed blob prefix from
        overview-ingest.blob_prefix (empty when cache_mode is bypass).
    cache_key:
      type: string
      description: |
        Fragment-digest portion of cache_prefix (from
        overview-ingest.cache_key). Empty when cache_mode is bypass.
    git_head:
      type: string
      description: |
        HEAD sha of the workspace (from overview-ingest.git_head).
    dirty:
      type: boolean
      description: |
        True when the workspace tree has uncommitted changes (from
        overview-ingest.dirty).
    cache_mode:
      type: string
      enum: [read-write, read-only, write-only, bypass]
      description: |
        Cache mode (from overview-ingest.cache_mode).
  required:
    - workspace_abs
    - feature_slug
    - description
    - build_system
    - build_installed_skills
    - fallback_build_cmd
    - test_system
    - test_installed_skills
    - fallback_test_cmd
    - workspace_brief
    - domains
    - cache_prefix
    - blob_prefix
    - cache_key
    - git_head
    - dirty
    - cache_mode
output:
  type: object
  additionalProperties: false
  properties:
    envelope:
      type: object
      additionalProperties: false
      description: |
        Aggregated context envelope consumed by embedding parent
        graphs (e.g. tinker's survey subgraph) via
        ${task:overview-exit:envelope.*} and by standalone runs as
        the final report. Pure fan-in: fields are echoes of the
        inputs with no derived data.
      properties:
        workspace_abs: {type: string}
        feature_slug: {type: string}
        description: {type: string}
        build_system: {type: string}
        build_installed_skills:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              name: {type: string}
              path: {type: string}
              description: {type: string}
              scripts:
                type: array
                items: {type: string}
            required: [name, path, description, scripts]
        fallback_build_cmd: {type: string}
        test_system: {type: string}
        test_installed_skills:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              name: {type: string}
              path: {type: string}
              description: {type: string}
              scripts:
                type: array
                items: {type: string}
            required: [name, path, description, scripts]
        fallback_test_cmd: {type: string}
        workspace_brief: {type: string}
        domains:
          type: array
          minItems: 6
          maxItems: 6
          items:
            type: object
            additionalProperties: false
            properties:
              slug: {type: string}
              name: {type: string}
              rationale: {type: string}
              reviewer_role: {type: string}
            required: [slug, name, rationale, reviewer_role]
        cache_prefix: {type: string}
        blob_prefix: {type: string}
        cache_key: {type: string}
        git_head: {type: string}
        dirty: {type: boolean}
        cache_mode:
          type: string
          enum: [read-write, read-only, write-only, bypass]
      required:
        - workspace_abs
        - feature_slug
        - description
        - build_system
        - build_installed_skills
        - fallback_build_cmd
        - test_system
        - test_installed_skills
        - fallback_test_cmd
        - workspace_brief
        - domains
        - cache_prefix
        - blob_prefix
        - cache_key
        - git_head
        - dirty
        - cache_mode
  required: [envelope]
